ives feedback immediately. Only after the learner can perform the task correctly does the teacher allow him to practice alone.\n\nResearch suggests that this gradual approach is more effective than leaving new learners alone from the first day. Without guidance, many learners repeat the same error again and again, and the error becomes a habit. With guidance, errors are corrected early. However, guidance should not continue for too long. If the teacher helps too much, the learner never learns to work independently.\n#שאלה What happens in guided practice? | A teacher shows each step, watches the first attempts, and gives feedback | The learner works alone from the first day | The learner only reads | The teacher does the task for the learner | זה התיאור בפסקה הראשונה.\n#שאלה Why is guided practice more effective for new learners? | Errors are corrected early, before they become habits | It is shorter | It requires no effort | It has no feedback | בלי הדרכה טעות חוזרת והופכת להרגל.\n#שאלה In paragraph 2, \"gradual\" means: | step by step | sudden | very fast | without a plan | gradual = הדרגתי.\n#שאלה What is the risk of too much guidance? | The learner never learns to work independently | The learner makes more errors | The teacher gets tired | The learner becomes disappointed | אם עוזרים יותר מדי, הלומד לא לומד לעבוד לבד.\n\n#סיפור Safety Before Speed | בינוני\nIn a large storage building, robots move boxes from one place to another, while human workers check and pack them. To make the work faster, the managers wanted the robots to move at a higher speed. The engineers agreed, but on one condition: safety must come first.\n\nEach robot has sensors that detect movement around it. If a person comes too close, the robot stops automatically. At a higher speed, the robot needs more time to stop, so the engineers required a larger safe distance. They also examined the data from a month of work and found three places where people and robots often met. In those places, the robots now move slowly.\n\nThe result was a small improvement in speed and no accidents. \"A fast system that is not safe,\" the engineer said, \"is not efficient at all.\"\n#שאלה What condition did the engineers set? | that safety must come first | that the robots stop working at night | that workers move faster | that there are fewer robots | זה התנאי שהמהנדסים הציבו.\n#שאלה What happens when a person comes too close to a robot? | The robot stops automatically | The robot moves faster | A warning appears on a screen only | The robot changes its planned route | החיישנים מזהים תנועה והרובוט נעצר.\n#שאלה Why did the engineers require a larger safe distance? | At a higher speed, the robot needs more time to stop | The robots were too big | The workers asked for it | The sensors were broken | במהירות גבוהה יותר דרוש מרחק עצירה גדול יותר.\n#שאלה What does the engineer mean in the last sentence? | A system is not really efficient if it is not safe | Fast systems are always safe | Safety is not important | Robots should be slow everywhere | יעילות בלי בטיחות אינה יעילות.\n\n#סיפור Similar but Not the Same | בינוני\nMany test questions include two answers that look similar. Both use words from the passage, and both seem correct at first. Students who read quickly often choose the first answer that looks familiar. Careful students compare the answers and look for the difference.\n\nUsually, the difference is small but important. One answer may describe what the passage says, while the other adds a detail that the passage does not mention. Or one answer may be true in general but irrelevant to the specific question. To distinguish between them, return to the text and find the evidence. If you cannot find a sentence that supports the answer, it is probably not the correct one.\n#שאלה Why do students who read quickly make mistakes? | They choose the first answer that looks familiar | They read the passage twice | They compare all the answers | They find the evidence | הם בוחרים את התשובה המוכרת הראשונה.\n#שאלה What do careful students do? | compare the answers and look for the difference | choose the longest answer | choose the first answer | leave difficult questions without an answer | זה ההבדל בין הקוראים.\n#שאלה According to the text, which answer is probably NOT correct? | an answer with no supporting sentence in the text | an answer that describes what the passage says | an answer with evidence | an answer that is relevant to the question | בלי ראיה בטקסט, כנראה שהתשובה לא נכונה.\n#שאלה In paragraph 1, \"similar\" is the opposite of: | different | same | correct | familiar | similar = דומה, וההפך שלו הוא different.\n\n#סיפור A Suitable Method for Every Goal | בינוני\nThere is no single method of learning that is suitable for every goal. A student who wants to remember new words may use cards and repeat them regularly. A student who wants to understand a long passage needs a different approach: reading carefully, finding the main idea, and asking questions about each section.\n\nFor this reason, it is important to evaluate your method from time to time. Ask a specific question: is this method helping me to reach my goal? If after several weeks the results remain unchanged, the method may not be effective for you, even if it works for others. Changing the method is not a failure. It is part of learning.\n#שאלה What is the main idea of paragraph 1? | Different goals require different methods | Cards are the best method | Every student learns the same way | Reading is not important | אין שיטה אחת שמתאימה לכל מטרה.\n#שאלה In paragraph 1, \"suitable\" means: | right for a specific purpose | difficult | old | expensive | suitable = מתאים.\n#שאלה When may a method not be effective for you, according to the text? | when after several weeks the results remain unchanged | when it is new | when other students use it | when it is easy | זה הסימן בפסקה השנייה.\n#שאלה What does the writer think about changing the method? | It is part of learning, not a failure | It is a failure | It should never happen | It is irrelevant | המשפט האחרון.\n\n#סיפור Recovering After a Bad Result | בינוני\nDana studied for weeks, but her first test result was much lower than she expected. That evening, she was so disappointed that she considered stopping her English lessons.\n\nThe next day, her teacher helped her review the test. Together they discovered that most of her errors came from one type of question: questions about the meaning of a word in context. This was good news, because it was a specific problem with a clear solution. Dana practiced this type of question regularly for a month.\n\nOn the next test, her result improved by 20 points. \"A bad result is information,\" her teacher said. \"It shows you where to focus. The important thing is how quickly you recover and what you learn from it.\"\n#שאלה How did Dana feel after her first test? | very disappointed | relieved | proud | bored | היא שקלה להפסיק את השיעורים.\n#שאלה What did Dana and her teacher discover? | Most of her errors came from one type of question | She did not study at all | The test was not fair | She needed a new teacher | רוב הטעויות היו בסוג שאלה אחד.\n#שאלה Why was this \"good news\"? | It was a specific problem with a clear solution | It showed that she was perfect | It showed that the test was easy | It showed that she could stop studying | בעיה ספציפית אפשר לפתור.\n#שאלה In the last paragraph, \"recover\" means: | to return to a good state after a difficult experience | to forget | to repeat a test | to stop learning | recover = להתאושש.\n\n#סיפור The Nurse and the Robot | בינוני\nWhen the hospital introduced a robot to carry supplies, many nurses were worried. Some feared that the machine would replace them. Others did not trust it, because in its first week it stopped twice in a crowded hall and caused a delay.\n\nAfter a month, the situation changed. The staff saw that the robot performed only one task: moving equipment from the storage room to each floor. It did not make decisions about patients, and it never tried to. The nurses, who had spent hours walking each night, now had more time for their patients. One nurse said, \"At first I saw a machine that wanted my job. Now I see a machine that gives me time to do my job.\"\n#שאלה Why were many nurses worried at first? | Some feared the robot would replace them, and others did not trust it | The robot was too expensive | Patients did not like the robot | The robot made decisions about patients | שתי הסיבות מופיעות בפסקה הראשונה.\n#שאלה What caused a delay in the first week? | The robot stopped in a crowded hall | The nurses refused to use it | The supplies were missing | The robot lost its route | הרובוט נעצר במסדרון צפוף.\n#שאלה What task did the robot perform? | moving equipment from the storage room to each floor | caring for patients | making medical decisions | cleaning the halls | זו המשימה היחידה שלו.\n#שאלה What does the nurse mean in the last sentence? | The robot does not take her job; it gives her more time for it | The robot will replace her soon | She does not trust the robot | She wants a new job | המשפט מבטא שינוי בגישה.\n\n#סיפור A Warning That Came in Time | בינוני\nAt four in the morning, the new flood system sent a warning to the people who live near the river: \"Serious event expected. The water level may reach the streets by eight.\" The prediction was based on high rainfall during the night and on data from sensors in the river.\n\nMany people did not believe it, because the old warning system had often been wrong. However, this time the warning arrived four hours earlier than any warning in the past, and the city had time to act. Workers closed two roads, and families moved their cars to higher places. At eight, the water reached the streets exactly as predicted. Nobody was hurt, and the damage was much smaller than in previous floods.\n#שאלה What information was the prediction based on? | high rainfall and data from sensors in the river | the opinion of the people in the city | the temperature only | old articles | התחזית התבססה על כמות גשם ונתוני חיישנים.\n#שאלה Why did many people not believe the warning? | The old warning system had often been wrong | The warning came too late | The warning was not clear | Nobody received it | חוסר האמון נבע מהעבר.\n#שאלה What was different about this warning? | It arrived four hours earlier than any warning in the past | It was the first warning in the history of the city | It was sent by the police | It was wrong | ההקדמה של ארבע שעות היא העיקר.\n#שאלה What was the result of the early warning? | Nobody was hurt, and the damage was smaller | The flood did not happen | The roads were damaged | The system was replaced | הזמן הנוסף איפשר לפעול ולצמצם נזק.\n\n#סיפור Clarify Before You Answer | בינוני\nIn many tests, students lose points not because they do not know the answer, but because they did not understand the question. A question may ask about a specific section of the passage, or it may require two details instead of one.\n\nGood students clarify the question before they answer it. They read it slowly, notice the important words, and ask: what exactly does this question require? Is it asking about the main idea or about a supporting detail? Is it asking what the writer says, or what we can understand from it? This takes only a few seconds, but it prevents many errors.\n\nIn class, the same principle applies. If an instruction is not clear, it is better to ask the teacher to clarify it than to choose an answer by chance.\n#שאלה Why do students often lose points, according to paragraph 1? | They did not understand the question | They did not know the answer | They wrote too much | They finished too early | הבעיה היא בהבנת השאלה, לא בידע.\n#שאלה What do good students do before they answer? | They clarify the question | They answer quickly | They leave the question without an answer | They read only the answers | הם מבהירים לעצמם מה השאלה דורשת.\n#שאלה In this text, \"clarify\" means: | to make something clear | to answer | to repeat | to delete | clarify = להבהיר.\n#שאלה What does the writer recommend when an instruction is not clear? | to ask the teacher to clarify it | to choose an answer by chance | to ignore it | to ask another student | זו ההמלצה במשפט האחרון.\n\n#סיפור Why the Robot Stopped | בינוני\nA delivery robot in an office building stopped in the same place every afternoon. There was no person and no object in its path, but the robot waited for several minutes before it continued. The engineers examined the data from its sensors and found the reason.\n\nEvery afternoon at four, the sun came through a large window and the light fell on a clean metal floor. The sensor detected the strong reflection and treated it as an object. Because the robot was designed for safety, it stopped every time it was not sure. The engineers did not remove this safety rule. Instead, they adjusted the sensor so that it could distinguish between a reflection and a real object. After the change, the robot continued on its planned route without a delay.\n#שאלה What was strange about the robot's behavior? | It stopped every afternoon although nothing was in its path | It stopped every morning | It moved too fast | It lost its route | הוא נעצר בלי סיבה נראית לעין.\n#שאלה What did the sensor detect? | the reflection of the sun on the floor | a person | a box | another robot | ההשתקפות נראתה לחיישן כמו חפץ.\n#שאלה Why did the robot stop every time it was not sure? | It was designed for safety | The engineers forgot to fix it | It had no battery | It wanted to rest | כלל הבטיחות גרם לעצירה.\n#שאלה What did the engineers do? | They adjusted the sensor to distinguish between a reflection and a real object | They removed the safety rule | They closed the window | They replaced the robot | הם שמרו על הבטיחות ושיפרו את החיישן.\n\n#סיפור Not All Information Is Relevant | בינוני\nA manager asked two workers to write a report about why customers left the company's website without buying. The first worker collected a huge amount of data: the time of each visit, the color of every button, the weather on each day, and much more. His report was 40 pages long, and nobody could find the main idea.\n\nThe second worker started with a question: at which step do most customers leave? She examined only the data that was relevant to this question and discovered that the majority left at the payment page, which was slow and confusing. Her report was two pages long, and it led to a clear decision. More information is not always better. The important skill is to distinguish between relevant and irrelevant data.\n#שאלה What was the problem with the first report? | It had too much information, and nobody could find the main idea | It was too short | It had no data | It was late | שפע מידע הסתיר את הרעיון המרכזי.\n#שאלה How did the second worker start? | with a specific question | by collecting all the data | by asking customers | by changing the website | היא התחילה בשאלה ממוקדת.\n#שאלה What did she discover? | The majority of customers left at the slow and confusing payment page | Customers did not like the colors | The weather was the cause | Customers bought too much | זה הממצא שהוביל להחלטה.\n#שאלה What is the main idea of the text? | The important skill is to distinguish between relevant and irrelevant data | More data is always better | Reports must be long | Managers should not ask questions | זה המשפט האחרון.\n\n#סיפור The Majority Is Not Always Right | בינוני\nIn an English lesson, the teacher asked a difficult question about a passage. Most of the students chose answer B, and only Yoni chose answer C. Several students laughed and told him that he was wrong.\n\nInstead of giving the answer, the teacher asked each side to show the evidence in the text. The students who chose B said that it \"sounded right.\" Yoni pointed to a specific sentence in the third paragraph that supported answer C. After the class examined the sentence carefully, the majority changed their opinion. The teacher explained the lesson: in reading, as in research, the correct answer is the one that the evidence supports, not the one that most people choose.\n#שאלה What did most students choose? | answer B | answer C | answer A | no answer | רוב הכיתה בחרה ב־B.\n#שאלה What did the teacher do instead of giving the answer? | She asked each side to show the evidence | She told Yoni that he was wrong | She chose answer B | She ended the class | המורה ביקשה ראיות מהטקסט.\n#שאלה Why did the students who chose B believe they were right? | The answer \"sounded right\" | They found a sentence in the text | The teacher told them | Yoni agreed with them | הם לא הביאו ראיה.\n#שאלה What is the lesson of the story? | The correct answer is the one that the evidence supports | The majority is always right | It is better to choose the most popular answer | Teachers should give the answer quickly | זה המשפט האחרון.\n\n#סיפור How to Maintain Motivation | בינוני\nMotivation is usually high at the beginning of a new study program. After a few weeks, however, the excitement disappears, and many learners find it difficult to continue. Researchers suggest several ways to maintain motivation over time.\n\nFirst, set small goals that you can reach in a short time, such as learning ten new words a week, instead of only one big goal for the end of the year. Each small success increases motivation. Second, measure your progress regularly, because it is easy to forget how much you have already improved. Third, find a reason that is important to you personally, not only a good score. Finally, remember that motivation follows action: often, you do not need motivation to start. Starting creates motivation.\n#שאלה What happens to motivation after a few weeks, according to the text? | The excitement disappears, and many learners find it difficult to continue | It always increases | It stays the same | It becomes too high | ההתלהבות של ההתחלה נעלמת.\n#שאלה Why are small goals useful? | Each small success increases motivation | They are easier to forget | They replace practice | They are required by teachers | הצלחות קטנות מחזקות מוטיבציה.\n#שאלה Why should learners measure their progress regularly? | It is easy to forget how much they have already improved | It makes the program shorter | It is a rule | It reduces effort | מדידה מזכירה את ההתקדמות.\n#שאלה What does \"motivation follows action\" mean? | Starting to act often creates motivation | You must wait for motivation before you act | Motivation is not important | Action is not important | ההתחלה עצמה יוצרת מוטיבציה.\n\n#סיפור Speed or Accuracy? | בינוני\nIn a reading test, Tom answered all 20 questions in 15 minutes, but only 11 answers were correct. His friend Maya answered only 16 questions in the same time, but 15 of them were correct. Who performed better?\n\nThe answer depends on the purpose of the test. If there is no time limit and only correct answers matter, Maya's approach is clearly better. Her accuracy was much higher. However, in a real test with a clear time limit, a student must also work efficiently. The best strategy is to combine the two: answer easy questions quickly, but read difficult questions carefully. Perfect accuracy is not always possible, but answering every question too quickly guarantees many errors.\n#שאלה Which student had higher accuracy? | Maya's | Tom's | They were the same | It is not possible to know | מאיה ענתה נכון על 15 מתוך 16.\n#שאלה According to the text, when is Maya's approach clearly better? | when there is no time limit and only correct answers matter | always | when the test is very short | when all questions are easy | זה התנאי בפסקה השנייה.\n#שאלה What strategy does the writer recommend? | answering easy questions quickly and reading difficult questions carefully | answering every question as quickly as possible | answering only easy questions | reading every question twice | השילוב בין מהירות לדיוק.\n#שאלה \"Perfect accuracy is not always possible, but answering every question too quickly guarantees many errors.\" The word \"guarantees\" here means: | makes certain | prevents | reduces | allows | guarantee = להבטיח, כלומר זה יקרה בוודאות.\n\n#סיפור What the Researcher Found | בינוני\nA young researcher wanted to know whether a new method could help students remember vocabulary. She divided 60 students into two similar groups. The first group studied with the traditional method: reading a list of words. The second group used the new method: each student wrote a short sentence with every word and repeated it after one day, three days and one week.\n\nThe researcher measured the results carefully. After a month, the second group remembered almost twice as many words. However, she did not immediately conclude that the method was effective. First, she checked whether the groups were really similar at the start, and whether the second group had spent more time studying. Only after she examined these conditions did she report her results.\n#שאלה What did the researcher want to know? | whether a new method could help students remember vocabulary | which students were the best | how to write a list | how many words students know | זו שאלת המחקר.\n#שאלה What was special about the new method? | Students wrote a sentence with every word and repeated it at several times | Students read a list of words | Students studied for one day only | Students studied alone without words | החזרה במרווחי זמן היא העיקר.\n#שאלה Why did the researcher not immediately conclude that the method was effective? | She wanted to check other conditions that could explain the result | She did not trust her data | The results were bad | She forgot to measure | מחקר טוב בודק הסברים חלופיים.\n#שאלה Which condition did she check? | whether the second group had spent more time studying | whether the students liked her | whether the words were in English | whether it rained | זו אחת משתי הבדיקות.\n\n#סיפור Help Is Available, but Few Use It | בינוני\nAt a large school, students can get free help with English every afternoon. Teachers are available in a special room, and students do not need permission to come. Yet only a small number of students use this service.\n\nWhen the school asked students why, the answers were surprising. Many did not know that the help existed. Others thought that it was only for weak students and felt embarrassed. A few said that they did not have time. The school decided to change its approach. Teachers explained the service in every class, the room received a new name, \"The Learning Center,\" and the hours changed to allow access after other afternoon activities. Within two months, the number of students who came doubled.\n#שאלה What is available to students every afternoon? | free help with English | free food | free books | extra games | זה השירות שמתואר בפסקה הראשונה.\n#שאלה Which reason did students NOT give for not using the help? | The teachers were not good | They did not know about it | They felt embarrassed | They did not have time | איכות המורים לא הוזכרה.\n#שאלה Why did the school change the name of the room? | so that students would not feel that it was only for weak students | because the old name was too long | because teachers asked for it | to attract new teachers | השם החדש נועד להפחית את תחושת הבושה.\n#שאלה What was the result of the changes? | The number of students who came doubled | Nobody came | The service was closed | The teachers left | התוצאה מופיעה במשפט האחרון.\n\n#סיפור Small Changes, Big Improvement | בינוני\nA professional team wanted to improve its performance, but the team was already training very hard. Their new trainer chose a different strategy. Instead of looking for one big change, he looked for many small improvements, each of them only about one percent.\n\nHe changed the time of their meals, tested their equipment in different conditions, and even taught them simple habits to reduce the chance of getting sick. Each change alone seemed irrelevant. Together, however, they contributed to a significant result: within a few years, the team began to win major competitions. The same approach can work for learners. Small, consistent improvements in many parts of their learning can lead to great progress.\n#שאלה What strategy did the new trainer choose? | looking for many small improvements | training the team much harder | looking for one big change | replacing the team | זו האסטרטגיה בפסקה הראשונה.\n#שאלה How big was each improvement? | about one percent | about ten percent | about half | very big | כל שיפור היה קטן מאוד.\n#שאלה In paragraph 2, \"contributed to\" means: | helped to cause | prevented | replaced | ignored | contribute to = לתרום ל־.\n#שאלה What can learners learn from the story? | Small, consistent improvements can lead to great progress | Only big changes matter | Practice is irrelevant | Competitions are important | זה הלקח בסוף.\n\n#סיפור Initially Difficult, Later Automatic | בינוני\nWhen Lior started to study English every morning, it was initially very difficult. She had to wake up 20 minutes earlier, and every morning she had to decide again to sit down and open the book. Some days she was too tired, and she needed a lot of discipline.\n\nAfter about two months, something changed. The morning practice became part of her routine, like drinking coffee. She no longer needed to decide; she simply did it. Lior had adapted to the new habit. Researchers say that this is typical: a new habit requires a lot of effort at first, but if it is repeated regularly, it gradually becomes automatic and requires almost no effort at all.\n#שאלה Why was the new habit initially difficult for Lior? | She had to wake up earlier and decide again every morning | She did not have a book | Her teacher was angry | She did not like English | שתי הסיבות מופיעות בפסקה הראשונה.\n#שאלה In paragraph 1, \"initially\" means: | at the beginning | finally | never | always | initially = בהתחלה.\n#שאלה What changed after about two months? | The practice became part of her routine | She stopped studying | She studied at night | She needed more discipline | התרגול הפך לחלק מהשגרה.\n#שאלה According to researchers, what happens to a habit that is repeated regularly? | It gradually becomes automatic | It becomes more difficult | It disappears | It requires more effort | הרגל שחוזר באופן קבוע הופך אוטומטי בהדרגה.\n\n#סיפור The Lottery Winner and the Accident | קשה\nImagine two people. The first one wins the lottery and receives a huge amount of money. The second one has a terrible accident and becomes paralyzed. Which one will be happier a year later?\n\nMost people believe that the answer is obvious: the winner, of course. But in a famous study, researchers found something surprising. They compared the happiness of three groups: lottery winners, people who were paralyzed after an accident, and ordinary people who had neither experience.\n\nRight after the event, the results were exactly what you expect. The winners were delighted, and the people who were paralyzed were very unhappy. However, over time, the difference became much smaller. After about a year, the lottery winners were not happier than ordinary people. In fact, they reported less pleasure from small, everyday things, such as talking with a friend or reading a good book. The people who were paralyzed were less happy than before the accident, but they were happier than most people expected.\n\nScientists call this process adaptation. Our brain gets used to a new situation, good or bad, and our level of happiness slowly returns to what it was before. A new car or a new phone gives us pleasure for a few weeks, and then it becomes ordinary.\n\nWhat can we learn from this research? Money can increase happiness for a short time, but it does not necessarily create lasting happiness. Small daily habits, such as spending time with people we love, may have a stronger influence than one big event.\n#שאלה What did most people expect, according to the text? | that the lottery winner would be happier | that the paralyzed person would be happier | that both would be unhappy | that nobody could answer | רוב האנשים חשבו שהזוכה יהיה מאושר יותר.\n#שאלה Which three groups did the researchers compare? | lottery winners, paralyzed people and ordinary people | winners, scientists and doctors | rich people, poor people and children | teachers, students and parents | שלוש הקבוצות מופיעות בפסקה השנייה.\n#שאלה How did the winners feel right after they won? | delighted | paralyzed | exhausted | embarrassed | delighted = שמח מאוד.\n#שאלה What happened over time? | The difference between the groups became much smaller | The winners became much happier | The paralyzed people did not change at all | The researchers stopped the study | עם הזמן ההבדל בין הקבוצות הצטמצם.\n#שאלה In paragraph 3, \"pleasure\" is closest in meaning to: | enjoyment | money | an accident | a decision | pleasure = הנאה.\n#שאלה What is \"adaptation\", according to the text? | getting used to a new situation | winning a lot of money | a kind of illness | a daily habit | המוח מתרגל למצב חדש, טוב או רע.\n#שאלה Which sentence is NOT correct, according to the text? | The lottery winners stayed delighted for many years | The paralyzed people were happier than people expected | A new phone gives pleasure only for a few weeks | Money can increase happiness for a short time | אחרי שנה הזוכים לא היו מאושרים יותר מאנשים רגילים.\n#שאלה What is the main idea of the last paragraph? | Daily habits may influence happiness more than one big event | Everyone should play the lottery | Accidents never change people | Research about happiness is not useful | הרגלים קטנים עשויים להשפיע יותר מאירוע גדול אחד.\n\n#סיפור Stuck at the Airport | בינוני\nWhen Dana arrived at the airport, she was tired but happy. Her flight home was in two hours, and she had all her documents in a small bag. At the entrance to the security area, an official asked for her passport. Dana opened the bag, and her face changed. The passport was not there.\n\nShe checked every pocket, and then she checked the bag again. The passport was gone. She remembered that she had put it on a bench near the coffee shop. She ran back, but the bench was empty.\n\nThe officials were polite, but the rules were clear: without a passport she could not fly. They explained that she had to go to the embassy, show some other papers, and ask for a temporary travel document. The embassy was closed until the morning.\n\nDana spent the night at the airport. She was starving, because all the shops were closed, and she was exhausted, because it was impossible to sleep on the chairs. She felt embarrassed when she called her family, but her brother laughed and said, \"It happens to everyone.\"\n\nIn the morning, she received good news. A cleaner had found the passport under the bench and had given it to the airport police. Dana was delighted. She took the next flight home, and since then she has a new habit: before she leaves any place, she checks her documents twice.\n#שאלה Why could Dana not enter the security area? | Her passport was not in her bag | Her flight was cancelled | She was late for the flight | The officials were rude | היא גילתה בכניסה שהדרכון לא בתיק.\n#שאלה Where did Dana think she had left her passport? | on a bench near the coffee shop | at the entrance | at home | at the embassy | היא נזכרה שהניחה אותו על ספסל.\n#שאלה What did the officials explain to her? | that she needed a temporary travel document from the embassy | that she could fly without a passport | that the police had her passport | that her flight was in the morning | הם הסבירו שצריך מסמך נסיעה זמני מהשגרירות.\n#שאלה In paragraph 4, \"starving\" means: | very hungry | very tired | very happy | very cold | starving = רעב מאוד.\n#שאלה Why was Dana exhausted? | She could not sleep on the airport chairs | She ran all night | She worked at the airport | She had an illness | exhausted = עייף מאוד, כי אי אפשר היה לישון על הכיסאות.\n#שאלה How did Dana feel when she called her family? | embarrassed | delighted | relieved | confident | embarrassed = נבוך.\n#שאלה Who found the passport? | a cleaner | an official | her brother | Dana herself | מנקה מצא אותו מתחת לספסל.\n#שאלה What is Dana's new habit? | She checks her documents twice before she leaves a place | She sleeps at the airport | She travels without a bag | She arrives at the airport late | זה ההרגל החדש שמתואר בסוף.\n\n#סיפור The Man Who Sold a Tower | קשה\nIn 1925, a man named Victor read a short article in a newspaper. The article said that the famous tower in Paris was old and expensive to repair, and that the city might take it down one day. Victor was not a real businessman. He was a criminal, and he immediately saw an opportunity.\n\nHe printed false government papers and invited five metal companies to a secret meeting in an expensive hotel. He told them that the government wanted to sell the tower for its metal, and that the sale had to be secret, because the decision would be unpopular. The businessmen believed him. His clothes were expensive, his documents looked official, and he spoke with confidence.\n\nOne of the businessmen, a man named André, wanted the deal very much. Victor noticed that André was a little nervous, so he used another trick: he told André that government officials earn very little money, and he hinted that a small extra payment would help. To André, this made the story even more believable, because he thought that only a real official would ask for money like this. André paid, and Victor left Paris with the money on the same day.\n\nThe most surprising part is what happened next. André was so embarrassed that he never told the police. He did not want people to know that he had believed such a scam. Later, Victor returned to Paris and tried the same trick again, but this time one of the businessmen went to the police, and Victor escaped just in time.\n\nThis story shows how a scam works. A criminal does not need a gun. He needs a believable situation, documents that look right, and people who are too embarrassed to admit their mistake.\n#שאלה Why did the article give Victor an idea? | It said the tower was old and expensive to repair | It said the tower was for sale | It was about metal companies | It was about a famous criminal | הכתבה אמרה שהמגדל ישן ויקר לתיקון.\n#שאלה What was Victor really? | a criminal | a government official | a metal businessman | a journalist | הטקסט אומר במפורש: He was a criminal.\n#שאלה Why did Victor say that the sale had to be secret? | because the decision would be unpopular | because the tower was fragile | because the police were looking for him | because the price was very low | הוא טען שההחלטה לא תהיה פופולרית.\n#שאלה Which of these did NOT help Victor look believable? | a real government office | expensive clothes | documents that looked official | the way he spoke with confidence | לא היה לו משרד ממשלתי אמיתי.\n#שאלה In paragraph 2, \"false\" papers are papers that are: | not real | very old | very expensive | from the government | false = שקרי, מזויף.\n#שאלה Why did the extra payment make André trust Victor more? | He thought only a real official would ask for money like that | He liked paying extra | Victor was his old friend | The police told him to pay | הבקשה לכסף נראתה לו כמו התנהגות של פקיד אמיתי.\n#שאלה Why did André not go to the police? | He was too embarrassed | He was a criminal too | He did not lose any money | He wanted to buy another tower | הוא התבייש שהאמין להונאה.\n#שאלה What is the main lesson of the story? | A scam works with a believable situation and people who are embarrassed to admit mistakes | Metal is very expensive | Government papers are always false | Businessmen never go to the police | זו המסקנה בפסקה האחרונה.\n\n#סיפור What Happens When Memory Breaks? | קשה\nFor many years, scientists believed that memory was one single ability: either you remember things, or you forget them. A famous case changed this idea.\n\nIn the 1950s, a young man had a serious illness of the brain. To help him, doctors removed a small part of his brain. He survived the operation, and his condition improved in one important way, but there was a terrible result: he could not create new memories. If you met him, talked with him for an hour, and then left the room for five minutes, he would not recognize you when you returned.\n\nResearchers studied him for many years, and they discovered something surprising. In one test, he practiced drawing a star while he looked at it in a mirror, which is a difficult task. Every day he said that he had never done this task before. However, his drawing improved from day to day. Part of his brain remembered the skill, even though he could not recall the practice itself.\n\nThis research showed that we have different kinds of memory. One kind lets us recall facts and events, such as what we ate for breakfast. Another kind lets us learn skills, such as riding a bike or typing, often without being aware of it. Damage to one part of the brain does not necessarily damage the other.\n\nFor learners, the lesson is encouraging. Even when you feel that you forget everything, practice is not lost. Your brain may be learning more than you think.\n#שאלה What did scientists believe before this case? | that memory was one single ability | that the brain had no memory | that skills were not important | that illness never affects memory | זו האמונה שמתוארת בפסקה הראשונה.\n#שאלה Why did doctors remove part of the man's brain? | to help him with a serious illness | to test a new idea | because he had an accident | because he asked them to | המטרה הייתה לעזור לו עם מחלה קשה.\n#שאלה What was the terrible result of the operation? | He could not create new memories | He could not walk | He did not survive | He forgot how to speak | הוא לא יכול היה ליצור זיכרונות חדשים.\n#שאלה In paragraph 2, \"recognize\" someone means: | to know who someone is when you see them again | to forget someone | to draw someone | to help someone | recognize = לזהות, להכיר.\n#שאלה What did the mirror test show? | His drawing improved, although he did not remember practicing | He could recall every practice | He could not draw at all | The task was easy for him | המיומנות השתפרה גם בלי זיכרון של התרגול.\n#שאלה In paragraph 3, \"recall\" is closest in meaning to: | bring back from memory | improve | practice | damage | recall = לשלוף מהזיכרון.\n#שאלה According to the text, which is an example of a skill? | riding a bike | what we ate for breakfast | a famous case | a test result | רכיבה על אופניים היא מיומנות.\n#שאלה What is the main idea of the last paragraph? | Practice is not lost, even when you feel that you forget | Learners should stop practicing | Memory can never change | Only scientists can improve memory | זה המסר המעודד בסוף.\n\n#סיפור The Day the Computers Stopped | קשה\nOn a normal Friday morning, millions of computers around the world suddenly crashed. Screens turned blue, and the computers started again and again without stopping. Airports could not check in passengers, hospitals could not open patient files, and banks could not process payments. Many people immediately thought that it was a cyberattack.\n\nIt was not. The cause was a simple mistake. A security company, whose software was designed to protect computers from attacks, had sent a content update to its customers. The update was supposed to help the software identify new threats. Instead, it contained an error. Because the software runs deep inside the system, the error caused the whole computer to crash.\n\nThe deployment of the update was automatic, so it reached a huge number of devices in a very short time. Organizations that were affected, and that depend on these computers every day, had to restore each computer, often by hand. Engineers worked day and night. Some systems were back in a few hours. For others, the process took many days, and the recovery happened only gradually.\n\nAfter the incident, the company explained what went wrong and how it would improve. For example, new updates would first go to a small group of computers, and only later to all users. In this way, if there is a problem, it affects only a few devices.\n\nThe incident taught an important lesson. A system that protects us can also become a risk, and a small error, multiplied by millions, can stop the world.\n#שאלה What did many people think at first? | that it was a cyberattack | that the screens were broken | that the banks were closed | that it was a test | בהתחלה חשבו שזו מתקפת סייבר.\n#שאלה What was the real cause? | an error in a content update | a hacker | very old computers | a slow network | הסיבה הייתה שגיאה בעדכון תוכן.\n#שאלה What was the security software designed to do? | protect computers from attacks | process payments | open patient files | check in passengers | designed to protect = נועד להגן.\n#שאלה Why did the update reach so many computers so fast? | Its deployment was automatic | Engineers sent it by hand | Users downloaded it on purpose | It was sent by email | ההפצה הייתה אוטומטית.\n#שאלה In paragraph 3, \"restore\" means: | make something work again | delete | protect | identify | restore = להחזיר לפעולה.\n#שאלה How did the recovery happen in some organizations? | gradually, over many days | immediately, in one minute | it never happened | automatically, without engineers | gradually = בהדרגה.\n#שאלה Which change did the company promise? | to send new updates first to a small group of computers | to stop sending updates | to sell new computers | to close the company | זה השינוי שמתואר בפסקה הרביעית.\n#שאלה What is the main lesson of the text? | A small error in a protective system can cause huge damage | Security software is not needed | Cyberattacks are not real | Airports should not use computers | זו המסקנה בסוף.\n\n#סיפור Why Learning Feels Frustrating | בינוני\nHave you ever studied a list of words, felt that you knew them all, and then forgot most of them the next morning? It is frustrating, but it is completely normal. In fact, it may be a sign that you are learning in a useful way.\n\nResearchers who study memory explain that recognizing a word and recalling it are two different things. When you read a word together with its translation, it feels familiar, so you think that you know it. But when you need to recall it without help, for example in a test, your brain must work much harder.\n\nThis is why many experts recommend practice that is a little difficult. Instead of reading the list again and again, cover the translation and try to remember it. You will fail sometimes, and that is the point. Every time you make an effort to recall a word, even if you make a mistake, the memory becomes stronger.\n\nAnother helpful method is to spread your practice over time. Ten minutes a day for a week works better than one hour the night before a test. You may feel that your progress is slow, but slow progress is not necessarily bad progress.\n\nSo the next time you forget a word that you studied yesterday, do not give up. Try again tomorrow. Eventually, the word will stop being new, and it will become yours.\n#שאלה According to the text, forgetting words the next morning is: | normal | a sign of an illness | very rare | a result of laziness | כתוב שזה נורמלי לגמרי.\n#שאלה What is the difference between recognizing and recalling? | Recalling means remembering without help, and it is harder | Recognizing is harder than recalling | They mean exactly the same | Recalling happens only at school | לשלוף מהזיכרון בלי עזרה קשה יותר מלזהות.\n#שאלה Why does a word with its translation feel familiar? | because you see the translation next to it | because you used it many times | because it is a short word | because it appears in a test | התרגום שליד המילה יוצר תחושה של היכרות.\n#שאלה What do experts recommend? | practice that is a little difficult | reading the list again and again | studying only the night before a test | practicing without making mistakes | הם ממליצים על תרגול שקצת קשה.\n#שאלה In paragraph 3, \"fail\" means: | not succeed | improve | remember | translate | fail = להיכשל.\n#שאלה Which plan works better, according to the text? | ten minutes a day for a week | one hour the night before a test | two hours once a month | reading the list once | תרגול מפוזר על פני זמן עובד טוב יותר.\n#שאלה \"Not necessarily bad\" means: | not always bad | always bad | very good | impossible | not necessarily = לא בהכרח.\n#שאלה What will happen \"eventually\", according to the writer? | The word will become yours | You will forget all the words | You will stop practicing | The test will be easy | eventually = בסופו של דבר.\n\n#סיפור Your New Laptop: A Short Guide | בינוני\nCongratulations on your new laptop! This short guide explains the basic things that every user should know.\n\nFirst, create an account and choose a strong password. Do not use the same password that you use on other websites. If the device asks for permission to save your password, make sure that you are the only user of this computer.\n\nNext, connect to the network and update the system. Updates are important, because they protect your device from new threats. Most updates now install automatically, but you can also check for updates in the settings. When an update is available, a message is displayed at the bottom of the screen. You can check a message like this later, but do not ignore it for too long.\n\nTo browse the internet, open the browser and type the address of a website. Some websites ask for access to your location or your camera. Select \"Allow\" only when it is really necessary.\n\nYour files are stored in folders. A folder can contain other folders, and in some programs a folder is called a directory. The full path of a file shows where it is, for example: Documents, then School, then English. To open a file, click on it twice. If you cannot find a file, use the search box and type part of its name. Before you close an application, always save your work.\n\nFinally, some folders are protected. If a folder is inaccessible and you see a warning, it usually means that you do not have permission to open it. Do not change system folders unless you know exactly what you are doing.\n#שאלה What is the first thing the guide recommends? | to create an account and choose a strong password | to open the browser | to buy a new device | to change system folders | זה הצעד הראשון בפסקה השנייה.\n#שאלה Why are updates important? | They protect the device from new threats | They make the screen bigger | They delete old files | They change the password | עדכונים מגינים מפני איומים חדשים.\n#שאלה Where does the message about an available update appear? | at the bottom of the screen | in the browser | in an email | inside a folder | ההודעה מוצגת בתחתית המסך.\n#שאלה When should you select \"Allow\"? | only when it is really necessary | always | never | when a website is slow | רק כשבאמת צריך.\n#שאלה What does the path of a file show? | where the file is | when the file was created | who created the file | how big the file is | הנתיב מראה איפה הקובץ נמצא.\n#שאלה What is another name for a folder, according to the text? | a directory | a browser | an account | an update | בחלק מהתוכנות תיקייה נקראת directory.\n#שאלה What does it usually mean when a folder is inaccessible? | You do not have permission to open it | The laptop is broken | The folder is empty | The network is slow | inaccessible = לא נגיש, בדרך כלל בגלל הרשאות.\n#שאלה What is the main purpose of this text? | to give basic instructions to a new user | to sell laptops | to explain how to build a website | to describe a cyberattack | זה מדריך למשתמש חדש.\n\n#סיפור Noam's First Function | בינוני\nNoam is learning to program. His teacher gave the class a simple task: write a function that receives a number as input and returns the number plus one.\n\nNoam wrote the code quickly and ran it. He typed 5, and the result was 51. Something was clearly incorrect. He looked at his code again and found the problem: the program received the input as text, not as a number. So instead of adding one to five, it simply put the text \"1\" after the text \"5\".\n\nNoam fixed the error. He created a variable, stored the value of the input in it as a number, and only then added one. He ran the program again. This time the output was 6. It was correct.\n\nNext, the teacher asked the students to connect their programs to a small server. The program had to send a request over the network and display the answer on the screen. Noam's program produced a warning: the server was not available. Noam was frustrated, but the teacher explained that the warning was not his fault. The server was temporarily down. Ten minutes later, the server was back, and the program worked automatically, without any change.\n\nAt the end of the lesson, Noam understood something important. An error does not always mean that your code is bad. Sometimes the problem is in your code, and sometimes it is somewhere else. A good programmer checks both.\n#שאלה What did the function need to do? | return the number plus one | multiply the number by two | display a picture | connect to a website | זו המשימה בפסקה הראשונה.\n#שאלה Why was the first result 51? | The program treated the input as text | Noam typed 51 | The server was down | The computer was broken | התוכנית קיבלה את הקלט כטקסט.\n#שאלה In paragraph 2, \"incorrect\" means: | wrong | slow | correct | available | incorrect = שגוי.\n#שאלה How did Noam fix the error? | He stored the input value in a variable as a number | He bought a new computer | He deleted the function | He asked a friend to type the code | הוא שמר את הערך במשתנה כמספר.\n#שאלה What did the program need to send to the server? | a request | a password | a file | a warning | send a request = לשלוח בקשה.\n#שאלה Why did the program show a warning? | The server was temporarily unavailable | There was an error in Noam's code | The network was protected | The output was too long | השרת לא היה זמין באופן זמני.\n#שאלה What happened when the server was back? | The program worked automatically | Noam had to rewrite the code | The program crashed | The teacher gave a new task | התוכנית עבדה לבד, בלי שינוי.\n#שאלה What did Noam learn? | An error is not always in your own code | His code is always perfect | Servers never stop | He should stop programming | זו המסקנה בפסקה האחרונה.\n\n#סיפור Guess the Meaning | קל\nMaya was reading a story in English when she found an unfamiliar word: \"starving.\" She did not want to stop and look for a translation, so she used the context. The sentence said: \"After a long day without food, the children were starving.\" The clue was clear: a day without food. Maya guessed that \"starving\" means very hungry.\n\nLater, she checked the explanation in the dictionary, and she was right. Now the word feels familiar, and she remembers it better than words that she simply translated.\n#שאלה What did Maya find in the story? | an unfamiliar word | a translation | a mistake | a picture | unfamiliar = לא מוכר.\n#שאלה How did Maya guess the meaning? | from the context | from a friend | from the title | from the dictionary first | היא השתמשה בהקשר.\n#שאלה What was the clue? | a day without food | a very long word | a hungry teacher | a picture of children | הרמז היה יום בלי אוכל.\n#שאלה Why does she remember the word better? | because she guessed it from the context | because it is short | because she translated it immediately | because she wrote it ten times | ניחוש מההקשר עוזר לזכור.\n\n#סיפור Careful, Slippery! | קל\nOn a rainy morning, the floor at the entrance to the school was very slippery. A student fell, and he was lucky that he was not hurt. The principal decided to close the main entrance temporarily and put a warning sign near the door. Students used a temporary entrance at the side of the building.\n\nSome students said that the sign was unclear, because it was small and the words were hard to read, so the principal printed a bigger one. A worker came the next day to repair the floor. He also moved a fragile glass table away from the door, because it could easily break.\n#שאלה Why was the floor dangerous? | It was slippery because of the rain | It was broken | It was made of glass | It was very old | slippery = חלקלק.\n#שאלה What did the principal do first? | She closed the main entrance temporarily | She repaired the floor | She bought a new table | She cancelled school | temporarily = באופן זמני.\n#שאלה Why did students say that the sign was unclear? | It was small and hard to read | It was in Hebrew | It was not near the door | It was red | unclear = לא ברור.\n#שאלה Why did the worker move the table? | It was fragile and could break | It was dirty | It belonged to a classroom | The students asked him to | fragile = שביר.\n\n#סיפור Cheap but Impractical | קל\nOmer needed a new bag for school. He found an inexpensive bag online, and the price was very attractive. But when the bag arrived, he understood why it was so cheap. It was small, it had no pockets, and the strap was too thin. It looked nice, but it was impractical for carrying heavy books.\n\nLater, Omer read the reviews. Most of them were brief but clear: the bag was very unpopular. Omer learned his lesson. Now he reads about the recommended products first. Reading reviews is optional, of course, but it is useful, especially when a product must be reliable.\n#שאלה Why did Omer choose the bag? | It was inexpensive | It had many pockets | His friend had one | It was recommended | inexpensive = זול.\n#שאלה Why was the bag impractical? | It was too small and weak for heavy books | It was too expensive | It was too big | It was the wrong color | impractical = לא מעשי.\n#שאלה What did the reviews say? | Most people did not like the bag | The bag was very popular | The bag was reliable | They did not say anything | unpopular = לא פופולרי.\n#שאלה What does Omer do now? | He reads about recommended products first | He buys only cheap products | He never buys online | He writes long reviews | זה הלקח שלו.\n\n#סיפור Take a Break | קל\nTamar was working on one math question for two hours, and she was exhausted. She could not solve a problem that looked simple, and she could not make a decision about what to try next. Her father told her to take a break. \"Your brain needs some rest,\" he said.\n\nTamar went for a short walk. When she came back, she remembered what her teacher always says: \"Follow instructions step by step.\" She read the question again slowly and noticed a detail that she had missed before. She decided to try again, and this time she solved it in ten minutes. Since then, she takes frequent, short breaks when she studies.\n#שאלה How did Tamar feel after two hours? | exhausted | delighted | embarrassed | confident | exhausted = מותש.\n#שאלה What did her father suggest? | to take a break | to stop studying math | to ask the teacher | to try a different question | take a break = לקחת הפסקה.\n#שאלה What helped her solve the problem? | She read the question again and followed the instructions step by step | Her father solved it | She found the answer online | She skipped the question | היא קראה שוב ועקבה אחר ההוראות.\n#שאלה In the last sentence, \"frequent\" breaks are breaks that happen: | often | rarely | never | only at night | frequent = תכוף.\n\n#סיפור The Topic and the Main Idea | בינוני\nIn an English lesson, the teacher wrote one paragraph on the board and asked, \"What is the topic?\" The students answered quickly: the paragraph was about bees. \"Good,\" said the teacher. \"And what is the main idea?\"\n\nThis question was harder. The topic is just the subject, but the main idea is what the writer says about it. The first sentence said: \"Bees are very important for farmers.\" The other sentences gave details and examples that support this idea, such as the explanation that bees help fruit grow.\n\n\"If you write only the topic,\" the teacher said, \"your answer is incomplete. A good answer can be brief, but it must show the purpose of the paragraph.\"\n#שאלה What was the topic of the paragraph? | bees | farmers | fruit | the board | topic = נושא.\n#שאלה What is the difference between the topic and the main idea? | The main idea is what the writer says about the topic | They are the same thing | The topic is always longer | The main idea is always the last sentence | הרעיון המרכזי הוא מה שהכותב אומר על הנושא.\n#שאלה What is the role of the other sentences? | to support the main idea with details and examples | to change the topic | to ask questions | to tell a different story | הם תומכים ברעיון המרכזי.\n#שאלה Why is an answer with only the topic incomplete? | It does not show the purpose of the paragraph | It is too long | It is not in English | It uses too many examples | incomplete = לא שלם.\n\n#סיפור From Papers to Digital | בינוני\nFor many years, a small town office kept all its documents on paper. There were enormous shelves full of papers, and finding one document could take an hour.\n\nTwo years ago, the office decided to move everything to a digital system. At first, it was a temporary project in one department only, but the results were so good that it became a lasting change for the whole office. Today, documents are available in seconds, from any computer in the office.\n\nThe change also had a positive influence on the workers. They spend less time searching for papers and more time helping people.\n#שאלה What was the problem with paper documents? | Finding a document could take a long time | They were too expensive | They were already digital | They were in English | חיפוש מסמך יכול היה לקחת שעה.\n#שאלה In the text, \"enormous\" means: | very big | very small | very old | very cheap | enormous = עצום.\n#שאלה How did the project start? | as a temporary project in one department | in the whole office at once | in another town | at the workers' homes | temporary = זמני.\n#שאלה What influence did the change have on the workers? | They spend more time helping people | They work more hours | They lost their jobs | They print more papers | influence = השפעה.\n\n#סיפור Confidently Wrong | קל\nDuring a quiz in class, the teacher asked, \"Which animal is the largest in the world?\" Ben raised his hand and answered confidently: \"The elephant!\" Some students nodded, because his confidence made the answer sound true.\n\n\"Is that true or false?\" the teacher asked the class. After a moment, Noa said, \"False. The blue whale is larger.\" Ben felt a little embarrassed. The teacher smiled and explained that the question was not a trick. \"Speaking with confidence is good,\" she said, \"but checking the facts is better.\" Eventually, Ben laughed too, and he never forgot the blue whale.\n#שאלה Why did some students believe Ben? | because he answered with confidence | because he was the teacher | because he showed a picture | because the question was easy | confidence = ביטחון.\n#שאלה What is the correct answer to the question? | the blue whale | the elephant | there is no answer | Ben's answer | נועה ענתה נכון.\n#שאלה How did Ben feel after Noa's answer? | a little embarrassed | very angry | starving | delighted | embarrassed = נבוך.\n#שאלה What is the teacher's main message? | Checking the facts is more important than sounding confident | Never answer in class | Questions in class are tricks | Confidence is always bad | זה מה שהמורה אומרת בסוף.\n\n#סיפור Small Pleasures | בינוני\nMany people believe that more money will bring them more happiness. Research shows that this is only partly true. Money can reduce stress when people do not have enough for their basic needs. But after that point, more money increases happiness only a little.\n\nWhat can increase happiness more? Small daily habits. For example, writing three good things about your day, walking outside for twenty minutes, or calling a friend. These habits give a small pleasure every day, and small pleasures add up over time.\n#שאלה According to research, when does money help happiness the most? | when people do not have enough for basic needs | when people are very rich | never | only on holidays | כסף עוזר כשחסר לצרכים בסיסיים.\n#שאלה \"Reduce stress\" means: | make stress smaller | make stress bigger | ignore stress | measure stress | reduce = להפחית.\n#שאלה Which is an example of a daily habit from the text? | walking outside for twenty minutes | buying a new car | winning the lottery | working more hours | זו אחת הדוגמאות.\n#שאלה What is the main idea of the text? | Small daily habits can increase happiness more than extra money | Money is not important at all | Habits are hard to change | Research about money is wrong | habit = הרגל.\n\n#סיפור The Winner | קל\nSam bought a lottery ticket every week for ten years. One evening, he checked the numbers on TV and could not believe his eyes: he was the winner! The next morning, his phone did not stop ringing. Friends that he had not heard from in years suddenly wanted to meet him, and many people offered him advice about the money.\n\nAt first, Sam enjoyed the attention, but eventually he felt tired of it. He decided to keep his job, give part of the money to his family, and save the rest. \"The money changed my bank account,\" he said, \"but I don't want it to change me.\"\n#שאלה How often did Sam buy a lottery ticket? | every week | every day | once in his life | once a year | כל שבוע במשך עשר שנים.\n#שאלה What happened after Sam won? | Many people suddenly wanted to talk to him | He lost his phone | He left the country | Nobody knew about it | הטלפון לא הפסיק לצלצל.\n#שאלה What did Sam decide to do? | keep his job and save part of the money | stop working | buy more tickets | spend all the money at once | זו ההחלטה שלו.\n#שאלה What does Sam mean in the last sentence? | He wants to stay the same person | He wants to change his life completely | He is sorry that he won | He wants a new bank | הוא לא רוצה שהכסף ישנה אותו.\n\n#סיפור Words That Grow | בינוני\nMany English words are built from smaller parts. If you know the parts, you can often guess the meaning of a new word. The beginning un- usually means \"not\": unfamiliar means not familiar, and unpopular means not popular. In- and im- can also mean \"not\", as in incomplete, incorrect, inexpensive and impractical.\n\nThe beginning re- usually means \"again\": to rewrite is to write again. Dis- often means the opposite, as in dislike. Endings are useful too. The ending -ful means \"full of\", so helpful means full of help, while -less means \"without\", so careless means without care.\n\nFinally, the ending -ly often turns a describing word into a way of doing something: quick becomes quickly, and confident becomes confidently.\n#שאלה What does the beginning un- usually mean? | not | again | full of | without | un- = לא.\n#שאלה What does \"rewrite\" mean, according to the text? | to write again | not to write | to write without care | to write quickly | re- = שוב.\n#שאלה Which word means \"without care\"? | careless | careful | carefully | helpful | -less = ללא.\n#שאלה What does the ending -ly usually do? | It turns a describing word into a way of doing something | It means \"again\" | It means \"not\" | It makes a word plural | ‎-ly = באופן, למשל quickly.\n\n#סיפור The Missing Folder | קל\nYoni saved his English project on the school computer, but the next day he could not find it. He decided to check a message from his teacher, who wrote: \"Look at the path at the top of the window.\"\n\nYoni looked at the path and saw that he had saved the project in the wrong directory, inside a folder called \"Temp.\" He selected the file, moved it to his own folder, and tried to open it. It worked! The teacher also explained that the \"Temp\" folder is sometimes cleaned automatically, so files there can suddenly become inaccessible.\n#שאלה Why could Yoni not find his project? | He had saved it in the wrong folder | The computer was broken | The teacher deleted it | He never saved it | הוא שמר בתיקייה הלא נכונה.\n#שאלה What did the teacher tell him to look at? | the path at the top of the window | the screen settings | a new folder | his password | path = נתיב.\n#שאלה What did Yoni do with the file? | He moved it to his own folder | He deleted it | He printed it | He sent it to his teacher | select = לבחור.\n#שאלה Why is it risky to keep files in \"Temp\"? | The folder may be cleaned automatically | It is too small | It has a password | It is on another computer | הקבצים עלולים להפוך ללא נגישים.\n\n#סיפור The Scientist Who Did Not Stop | בינוני\nDr. Lea Mor was a young scientist when doctors told her that she had a serious illness. They explained that her condition would slowly damage her ability to walk. Many people expected her to stop her research. She did not.\n\nShe continued to study the brain, and she used her own experience to ask new questions: how do people survive difficult news, and how does the brain adapt to a new situation? Her team discovered that the brain can change more than researchers once believed. Today she uses a wheelchair, but her work has helped thousands of patients.\n#שאלה What did the doctors tell Lea? | that she had a serious illness | that she was a great scientist | that she needed a new job | that her brain was perfect | illness = מחלה.\n#שאלה How did the illness affect her? | It slowly damaged her ability to walk | It stopped her research | It damaged her memory | It did not affect her at all | damage = לפגוע.\n#שאלה What questions did she study? | how people survive difficult news and how the brain adapts | how to build a wheelchair | how to become a doctor | how to win the lottery | survive = לשרוד.\n#שאלה What did her team discover? | The brain can change more than researchers once believed | The brain never changes | Illness always stops research | Scientists cannot study themselves | זו התגלית של הצוות.\n\n"};
