{t:"The Lost Key",s:1,lv:2,p:["Every morning, Dan leaves the house at seven. He takes his bag, his phone, and his key. But on Thursday morning, he cannot find his key. He looks in his bag, on the table, and in the kitchen. The key is not there.","Dan is late for work, and he starts to feel nervous. He calls his sister. \"Did you see my key?\" he asks. \"No,\" she says. \"Did you check the car?\" Dan checks the car, but the key is not there.","Then Dan remembers something. Last night, the weather was warm, so he ate dinner in the garden. He thinks the key is probably still outside.","He goes to the garden. On the bench, next to an old book, he finds his key. Dan laughs, because the key was in a safe place all night. Only he did not know it.","Dan arrives at work ten minutes late. His team is in the lab, so he says sorry and tells them the story. Now Dan has a new idea: the key always stays on the shelf near the door."],
q:[["When does Dan usually leave the house?","At seven",["At ten","At noon"]],["Who does Dan call?","His sister",["His teacher","His father"]],["Where does Dan find the key?","On the bench in the garden",["In his car","In his bag"]],["Why was the key in the garden?","Dan ate dinner outside the night before",["His sister took it there","The cat carried it outside"]],["How does Dan feel when he finds the key?","Relieved",["Angry","Hungry"]],["What is Dan's new idea?","To keep the key on the shelf near the door",["To buy a new key every week","To leave the house at six"]]]},
{t:"The Quiet Student",s:1,lv:3,p:["Omer is a new student in the English class. He is always on time, his homework is perfect, and his notes are clear. But he never speaks in class. When the teacher asks a question, Omer looks at his book.","Some students think that Omer does not like them. Others think that the lessons are too easy for him. But the teacher notices something: when Omer reads alone, he reads very well, and he understands every word.","One day, the teacher asks Omer to stay after class. \"Your work is perfect,\" she says. \"Why do you never speak?\" Omer is quiet for a long time. Then he whispers: \"In my old school, I made a mistake when I was reading, and the class laughed. After that day, I was afraid to speak.\"","The teacher does not laugh. She tells him that when she was a student, she was nervous too, and she made many mistakes in English. \"Mistakes are normal,\" she says. \"They are part of learning.\" She has a simple idea: every day, Omer will answer one question in class. Only one.","The first day is difficult, and his answer is very short. But nobody laughs. After a month, Omer answers three questions in every lesson. He is still a quiet person, but now he is not afraid."],
q:[["Why did Omer never speak in class?","He was afraid that the class would laugh at him",["He did not know the answers","He did not like the teacher"],"בפסקה 3 עומר מספר שבבית הספר הקודם צחקו עליו כשטעה. שתי האפשרויות האחרות הן מה שחשבו התלמידים, לא הסיבה האמיתית."],["What did the teacher notice?","Omer reads very well when he is alone",["Omer's homework has many mistakes","Omer talks a lot with his friends"],"פסקה 2: כשעומר קורא לבד הוא קורא טוב מאוד. שתי האפשרויות האחרות סותרות את הטקסט."],["Why does the teacher tell Omer that she made mistakes as a student?","To show him that mistakes are normal",["To make him laugh","To explain a new lesson"],"מיד אחרי הסיפור שלה היא אומרת Mistakes are normal. זו המטרה של הסיפור."],["Which sentence is NOT right about Omer?","At the end, he talks more than every other student",["His homework is perfect","After a month, he answers questions in class"],"בסוף כתוב שהוא עדיין אדם שקט. שתי האפשרויות האחרות כתובות בסיפור."],["What is the main idea of the story?","Fear of mistakes can stop us, but it can change",["Homework is more important than speaking","English is too difficult for new students"],"הסיפור עוסק בפחד של עומר מטעויות ובאיך שהוא השתנה. האפשרויות האחרות לא עולות מהטקסט."]]},
{t:"The Slow Website",s:2,lv:2,p:["Tamar is an engineer at a small startup. The company has a website where users order coffee and breakfast. On Monday morning, many users sent angry messages: the website was very slow, and some pages did not load at all.","Tamar checked the performance data. The server was online, the network connection was stable, and the speed of the internet was normal. But the latency was high: every page needed almost ten seconds.","Then she opened the log. Every request from a user sent a query to the database, and each query took a long time. The reason was simple. Last week, a developer added a new feature: a list of the most popular orders. This feature asked the database for all the orders, every time, for every user.","Tamar had an idea. She used a cache. Now the server saves the list in the cache for ten minutes, so the database answers this question only once in ten minutes, and not for every user. She tested the change carefully, and then she deployed it.","After the deployment, the latency dropped, and every page loaded in one second. The users were happy again. In her report, Tamar wrote a short rule for the team: \"Before you add a feature, test its speed with real data.\""],
q:[["What was the problem on Monday morning?","The website was very slow",["The server was offline","The users forgot their passwords"]],["What did Tamar find in the log?","Every request sent a slow query to the database",["A hacker attacked the server","The network cable was broken"]],["Why did the new feature cause a problem?","It asked the database for all the orders every time",["It deleted the old orders","It used too much battery"]],["How did Tamar fix the problem?","She saved the list in a cache",["She bought a new server","She stopped the website"]],["What is the rule in Tamar's report?","Test the speed of a feature with real data",["Never add a new feature","Deploy every change on Monday"]]]},
{t:"A Bad Update on Friday",s:2,lv:2,p:["On Friday afternoon, the team at a small company wanted to release a new version of their application. The new version had a better search feature, and everyone was excited. All the tests worked, so Ron, the programmer, deployed the update and went home.","At night, the alerts started. Users could not log in to their accounts. The application showed an error message, and the number of angry posts on social media increased very fast.","Ron opened his laptop and checked the log. The new version used a new library for passwords, but this library needed a setting that was missing on the real server. On the test server, the setting existed, so the tests did not find the bug.","Ron did not try to fix the code at night. Instead, he restored the old version from the backup, and after ten minutes, users could log in again. In the morning, the team added the missing setting, tested the update in an environment that was the same as the real server, and deployed it again.","In the meeting on Monday, the team wrote two new rules. First, the test environment must be the same as the real environment. Second, nobody deploys on Friday afternoon. Ron agreed. He wanted to sleep on Friday nights."],
q:[["Why did the tests not find the bug?","The test server had the setting, but the real server did not",["Ron did not run the tests","The tests were on the wrong laptop"]],["What did Ron do first to help the users?","He restored the old version",["He wrote new code all night","He called every user"]],["What happened on social media?","More and more angry posts appeared",["Users said the new search was perfect","Nobody noticed the problem"]],["Which rule did the team add?","Nobody deploys on Friday afternoon",["Every programmer works at night","Tests are not important"]],["Why did Ron agree with the new rule?","He did not want to fix problems at night",["He did not like the new feature","He wanted to leave the company"]]]},
{t:"Who Sent the Email?",s:2,lv:3,p:["On Thursday morning, Lior, a worker in the payment team, received an email from the security team. The message said: \"We found a breach. Click the link and enter your password in ten minutes, or your account will be closed.\"","Lior was busy, and the message looked real. It had the symbol of the company, and the name in the address was \"Security Team\". But two things looked strange. First, the domain in the address was not the company domain: one letter was wrong. Second, the message wanted him to act very fast.","Lior did not click the link. He called a friend from the security team and asked about the email. His friend checked and said that the security team did not send any email that morning. The message was phishing: a hacker wanted to steal passwords and get access to the payment system.","The security team sent a warning to every worker. They found that three workers clicked the link, and one of them entered his password. The team changed that password in a few minutes, checked the log of the account, and found no attack on the payment system.","After the event, the company added a second step to every account: a code that arrives on the phone. Now a password alone is not enough to enter an account, so a stolen password is not enough for a hacker."],
q:[["Which detail made Lior suspicious?","One letter in the domain was wrong",["The email had the symbol of the company","The name in the address was \"Security Team\""],"הסמל והשם דווקא גרמו להודעה להיראות אמיתית. מה שעורר חשד הוא הדומיין עם האות השגויה, וגם הלחץ לפעול מהר."],["Why did the hacker ask Lior to act in ten minutes?","So he would not stop and think",["Because the account was really in danger","Because the system closes accounts every ten minutes"],"לחץ זמן הוא טריק נפוץ בדיוג: מי שממהר לא בודק. אין בסיפור שום רמז שהחשבון היה בסכנה אמיתית."],["Which sentence is NOT right?","Nobody clicked the link",["One worker entered his password","The security team did not send the email"],"פסקה 4: שלושה עובדים לחצו על הקישור. שתי האפשרויות האחרות נכונות."],["What can we understand from paragraph 4?","The team acted fast, so the hacker did not get into the payment system",["The hacker stole money from the payment system","The three workers lost their jobs"],"הצוות החליף את הסיסמה תוך דקות ולא מצא התקפה על מערכת התשלומים. בטקסט אין מידע על פיטורים או על גניבה."],["Why is a password alone not enough now?","Every account also needs a code from the phone",["The passwords are too short","The company deleted all the passwords"],"פסקה 5: נוסף שלב שני, קוד שמגיע לטלפון."]]},
{t:"Learning from Failure",s:3,lv:2,p:["Noam failed his first big exam of the year. He studied for many hours, so the result was a surprise. At first, he blamed the teacher and the questions. Then he decided to examine his own method.","He made a list of the things he did before the exam. He read his notes again and again, but he never checked if he could answer questions without the notes. He also studied alone, late at night, when he was tired.","Noam asked a teacher for advice. She suggested a new approach. Instead of reading the same notes, he should practice with old exams, and he should explain each topic to another person. \"When you explain,\" she said, \"you find what you do not understand.\"","Noam joined a study group with three other students. Every week, each student chose one topic and taught it to the others. At first, it was difficult and slow, but soon the group noticed real progress. Noam also changed his hours: he studied in the morning, and he slept enough.","In the next exam, Noam got a high result. But the most important outcome was not the number. He understood that effort is not enough, and that the method is also important. Failure, he said, was a good teacher."],
q:[["What was wrong with Noam's first method?","He never checked if he could answer without his notes",["He did not study at all","He studied with too many friends"]],["What did the teacher suggest?","To practice with old exams and to explain topics to others",["To read his notes more times","To study only at night"]],["What helped the group make progress?","Each student taught one topic to the others",["The teacher gave them the answers","They studied only on Friday"]],["Why did Noam blame the teacher at first?","It was hard for him to see his own mistakes",["The teacher did not like him","The questions were in another language"]],["What is the main lesson of the story?","How you study is as important as how long you study",["Failure means you should stop","Studying alone is the most effective method"]]]},
{t:"Does Coffee Improve Memory?",s:3,lv:3,p:["A popular article claims that coffee improves memory. The article describes research with a group of students. Students who drank coffee every morning remembered more new words in a test than students who drank only water.","The article concludes that everyone should drink more coffee to improve memory. It was shared by many people on social media, and some schools even started to offer free coffee to students before exams.","However, if we examine the research carefully, several problems appear. First, the sample was small, and all the students came from the same class. Second, the students chose their own group. Students who drink coffee every morning tend to wake up early and go to sleep at the same time every night. Sleep, and not coffee, may be the real factor.","Third, the researchers measured memory only once, on the same morning. The effect might disappear after a few hours. And finally, the research was paid for by a company that sells coffee. This does not prove that the results are wrong, but it is a reason to be careful.","The research does not show that coffee has no effect. It only shows that the question is still open. A good reader asks: who was in the sample, which other factors are possible, and who paid for the research?"],
q:[["What does the article claim?","Coffee improves memory",["Water is bad for memory","Students should sleep more"],"זו הטענה במשפט הראשון. השינה מופיעה בהמשך כהסבר אפשרי אחר, לא כטענה של המאמר."],["Which problem with the research does the text NOT mention?","The coffee was too hot",["The sample was small","A coffee company paid for the research"],"הטקסט מזכיר מדגם קטן ומימון של חברת קפה. על הטמפרטורה של הקפה אין מילה, וזו מלכודת שנשמעת הגיונית."],["Why does the writer mention sleep?","Sleep may be the real reason for the results",["The students slept during the test","Coffee helps people sleep"],"מי ששותה קפה כל בוקר גם הולך לישון בזמן קבוע, כך שייתכן שהשינה, ולא הקפה, משפרת את הזיכרון."],["What does the writer think about the research?","It does not prove the claim",["It proves that coffee is dangerous","It is perfect and reliable"],"הכותב לא אומר שהמחקר שגוי, אלא שהוא לא מוכיח את הטענה והשאלה עדיין פתוחה."],["\"This does not prove that the results are wrong.\" What does the writer mean?","Who paid for the research is a reason to check, not a proof of a mistake",["The results are always right","The company changed the results"],"מימון של חברה מעורבת הוא סיבה לזהירות, אבל לא הוכחה. האפשרות השלישית מוסיפה האשמה שלא מופיעה בטקסט."]]},
{t:"Two Managers, Two Approaches",s:3,lv:3,p:["Two teams in the same company had the same goal: to finish a new application in six months. The manager of the first team, Dana, made a detailed plan at the start. Every step had a specific week, and every worker had a specific role.","The manager of the second team, Omer, chose another approach. His team built a simple version in two weeks, showed it to real users, and changed the plan after they received feedback. Many steps in his plan changed more than once.","After three months, Dana's team was on time, and the company was happy. Omer's team looked slow: their application had fewer features, and they removed some features that users did not want.","Then the company did a test with real users. Dana's application had every planned feature, but users found it confusing, and they used only a small part of it. Omer's application was simpler, but users understood it immediately and used it every day.","The company did not conclude that plans are useless. Dana's team was very effective at following a plan, and when the goal is clear and stable, her approach is often the right one. The lesson was about information: when you do not know what users want, it is a risk to plan every detail at the start."],
q:[["What was the main difference between the two approaches?","Omer changed the plan after feedback, and Dana followed a detailed plan",["Dana had more workers than Omer","Omer's team did not have a goal"],"פסקאות 1 ו־2: דנה תכננה הכול מראש, ועומר שינה את התוכנית לפי משוב ממשתמשים. על מספר העובדים אין מידע."],["Why did Omer's team look slow after three months?","Their application had fewer features",["They did not work at all","Their manager was sick"],"פסקה 3: באפליקציה שלהם היו פחות תכונות, והם אף הסירו חלק מהן."],["What happened in the test with real users?","Users preferred the simpler application",["Users liked every feature in Dana's application","Users could not open Omer's application"],"פסקה 4: המשתמשים הבינו מיד את האפליקציה הפשוטה והשתמשו בה כל יום."],["Which sentence would the writer agree with?","A detailed plan is useful when the goal is clear and stable",["Plans are always useless","Dana's team failed because it was slow"],"פסקה 5 אומרת במפורש שהחברה לא הסיקה שתוכניות חסרות תועלת, ושהגישה של דנה טובה כשהמטרה ברורה ויציבה."],["What is the main lesson of the text?","When you do not know what users want, it is a risk to plan every detail at the start",["Big teams always work better","Users do not like new applications"],"המשפט האחרון מסכם את הלקח: הבעיה היא חוסר מידע על המשתמשים, לא תכנון באופן כללי."]]},
{t:"The Friday Incident",s:4,lv:2,p:["At 18:05 on a Friday, the dashboard showed a sudden spike in errors: one request in ten failed with a timeout. Users could not finish their payments, and the support team received many angry calls.","Maya, the engineer on call, opened an incident and asked two other engineers to join. The first question in every incident is not \"why?\" but \"what changed?\". The team checked the deployment log: nothing was deployed that day. The metrics also showed that the traffic was normal, so the problem was not a sudden peak of users.","Then they examined each component. The payment service called the service of another company to verify every payment. That service was slow, and every call waited ten seconds until the timeout. In addition, the code used retry: after each timeout, it sent the same request again, three times.","These retries created a bottleneck. The requests waited in line, the load balancer thought that healthy servers were slow, and the whole system became slower. A small problem in one service became an incident in every service.","The team made two quick changes: they reduced the timeout to two seconds, and they limited the retries to one. The errors dropped in a few minutes. In the postmortem on Monday, the team agreed that the root cause was not the slow service of the other company, but their own configuration: no system should wait so long for another system."],
q:[["How did the team first notice the incident?","A spike in errors on the dashboard",["An angry email from a manager","A deployment on Friday"]],["Why did the team check the deployment log first?","In an incident, the first question is what changed",["Maya deployed new code that day","The log showed a hacker"]],["How did the retries affect the system?","They sent more requests to a slow service and created a bottleneck",["They fixed the timeout","They stopped all the requests"]],["In the opinion of the team, what was the root cause?","Their own configuration: they waited too long for another system",["The slow service of the other company","Too many users on Friday"]],["Which changes did the team make?","They reduced the timeout and limited the retries",["They removed the load balancer","They moved the system to another cloud"]]]},
{t:"The Chatbot That Was Too Sure",s:4,lv:3,p:["A startup built a chatbot to answer questions about the company's own documents. In the first test, the answers looked perfect: fast, clear, and confident.","But one engineer, Noa, noticed something odd. When she asked about a policy that did not exist, the chatbot did not say \"I do not know\". Instead, it created a detailed answer, with the name of a document that did not exist. This is called a hallucination: the model gives an answer that looks reliable, but it is not based on any real source.","The team measured the problem. They prepared a dataset of real questions and checked each answer by hand. The accuracy was high for simple questions, but for questions about rare cases, the model often gave a wrong answer, and it looked just as confident.","Noa suggested three changes. First, the chatbot must show the source of each answer, so users can verify it. Second, when the model cannot find a relevant document, it should say so explicitly. Third, the team will evaluate the model every month with new questions, because a model that is accurate today may fail in the future, when the documents change.","Some managers were reluctant. The new answers were shorter, and the chatbot said \"I do not know\" more often. But after a month, the number of serious mistakes dropped, and users trusted the chatbot more. As Noa wrote in her report: a model that shows its limits is more useful than a model that is always confident."],
q:[["What made Noa suspicious?","The chatbot answered a question about a policy that did not exist",["The answers were too slow","The chatbot said \"I do not know\" too often"],"פסקה 2: הצ׳אטבוט המציא תשובה מפורטת על מדיניות שלא קיימת. האפשרות השלישית היא דווקא מה שקרה אחרי השינויים."],["In paragraph 2, what is a \"hallucination\"?","An answer that looks reliable but has no real source",["A slow answer from a model","A question that the model cannot read"],"ההגדרה מופיעה מיד אחרי המילה: תשובה שנראית אמינה אבל לא מבוססת על שום מקור אמיתי."],["Why did the team check the answers by hand?","To measure how often the model was wrong",["Because the dataset was lost","To make the chatbot faster"],"פסקה 3 נפתחת ב־The team measured the problem: הבדיקה הידנית נועדה למדוד."],["Why will the team evaluate the model every month?","The documents change, so a model that is accurate today may fail",["The model gets tired after a month","The managers want more meetings"],"פסקה 4: מודל שמדויק היום עלול להיכשל כשהמסמכים משתנים."],["Which sentence is closest to the main idea?","A model that shows its limits is more useful",["Short answers are always better","Users do not care about mistakes"],"זה המשפט שמסכם את הדוח של נועה. לפי הטקסט, המשתמשים דווקא סמכו יותר כשהטעויות ירדו."]]},
{t:"The Memory Leak",s:4,lv:3,p:["Every night at about 3:00, the search service crashed. It started again automatically after a minute, so most users did not notice. For weeks, the team used a workaround: a script that stopped and started the service every evening, before the crash.","Ron, a new engineer, did not like the workaround. \"The script does not fix the problem,\" he said. \"It only stops us from seeing it.\" He opened the dashboard and looked at the memory metric. The pattern was clear: the memory that the service used increased slowly all day, and it never went down. When it reached the threshold of the server, the service crashed.","This is a typical memory leak: the program keeps data in memory that it no longer needs. Ron used a tool to record the memory at noon and in the evening, and he compared the two records. One object increased much faster than the others: a cache for search results.","The code added every new query to the cache, but it never removed old queries. On a quiet day the cache stayed small, but on a busy day it became enormous. The fix was simple: now the cache keeps only the most recent queries and deletes the old ones.","After the fix, the memory metric became stable, and the crashes stopped. The team removed the script. In the postmortem, they added a new rule: a workaround is OK for a short time, but every workaround needs a person who is responsible for the real fix, and a deadline."],
q:[["Why did most users not notice the crashes?","The service started again after a minute",["The crashes happened during the day","The team told every user about them"],"פסקה 1: השירות עלה שוב אוטומטית אחרי דקה, וזה קרה בלילה."],["What was Ron's opinion about the workaround?","It only stops the team from seeing the problem",["It was a perfect solution","It made the service slower"],"רון אומר שהסקריפט לא מתקן, רק מונע מהם לראות את הבעיה."],["Which evidence showed a memory leak?","Memory increased all day and never went down",["The network traffic was very high","The service crashed only on busy days"],"פסקה 2: הזיכרון עלה לאט כל היום ואף פעם לא ירד. השירות קרס כל לילה, לא רק בימים עמוסים."],["What was the root cause?","The cache never removed old queries",["The server had too little memory","A hacker sent too many queries"],"פסקה 4: הקוד הוסיף כל שאילתה למטמון ומעולם לא הסיר ישנות. שרת עם יותר זיכרון רק היה דוחה את הקריסה."],["What is the new rule about workarounds?","Each workaround needs a responsible person and a deadline",["Workarounds are not allowed","Every service must stop every night"],"המשפט האחרון: פתרון עוקף בסדר לזמן קצר, אבל צריך אחראי ומועד לתיקון האמיתי."]]},
{t:"Writing a Research Article",s:4,lv:2,p:["Dana is writing her first research article. Her hypothesis is simple: students who sleep more than seven hours remember more new words.","Before she started her experiment, she read the literature: what did other researchers already find? She found several articles with similar results, and one article that contradicted them. She kept a list of every source, because every claim in her article needs a citation.","Her methodology was simple. A group of participants wrote down how many hours they slept, and the next morning they took a word test. Dana knew that a correlation is not proof of a cause: it is possible that students who sleep more also study more. She mentioned this problem in her article.","The first draft was long and confusing. Her teacher asked her to revise it: one idea in each paragraph, short sentences, and a clear abstract at the start. She also used a tool to check for plagiarism, because some of her sentences were too similar to a source. She paraphrased them and added citations.","The final article was shorter than the first draft, but much clearer. Her teacher said that a good article is not the one with the most words, but the one where every sentence has a purpose."],
q:[["What was Dana's hypothesis?","Students who sleep more remember more new words",["Coffee improves memory","Long articles are better"]],["Why did Dana keep a list of every source?","Every claim needs a citation",["Her teacher wanted a long list","She wanted to use their sentences"]],["Why is a correlation not proof of a cause?","Another factor can explain the result",["The sample was too big","A correlation is always wrong"]],["What did Dana do after the plagiarism check?","She paraphrased the sentences and added citations",["She deleted the whole article","She stopped the research"]],["In the opinion of her teacher, what makes a good article?","Every sentence has a purpose",["It has many words","It has many sources"]]]},
{t:"The Fastest Database?",s:4,lv:3,p:["A company published a benchmark that claims its new database is three times faster than any other database. The article was shared widely on social media, and several teams decided to migrate.","An independent engineer, Lior, read the methodology carefully. He found that the test used only one kind of query: simple reads of small records. Real applications also write data, run complex queries, and handle many users at the same time.","In addition, the other databases in the test used their default settings, while the new database was optimized by its own engineers. And the test measured only throughput: how many requests the database answers in one second. It did not measure latency during a peak of traffic.","Lior ran his own test with real data from his company. The new database was faster for simple reads, but it was slower when many users wrote data at the same time. In the end, the difference was small.","Lior did not claim that the results were not real. The numbers were probably real, but they answered a narrow question. Before you migrate, he wrote, test the system with your own data and your own queries."],
q:[["What did the benchmark claim?","The new database is three times faster than any other",["The new database is cheaper","The new database never crashes"],"זו הטענה במשפט הראשון. על מחיר או על קריסות אין מילה."],["Which problem with the benchmark does Lior NOT mention?","The test was too short",["Only one kind of query was used","The other databases used default settings"],"פסקאות 2 ו־3 מזכירות סוג שאילתה אחד והגדרות ברירת מחדל. על משך הבדיקה אין מידע."],["Why is measuring only throughput a problem?","It does not show how fast the database answers during a peak",["Throughput is not a real metric","It shows only the price"],"תפוקה מודדת כמה בקשות נענות בשנייה, אבל לא כמה מהר כל משתמש מקבל תשובה בזמן עומס."],["What does Lior think about the numbers in the benchmark?","They are probably real, but they answer a narrow question",["They are not real","They prove the database is the right choice for everyone"],"פסקה 5: הוא לא טוען שהתוצאות לא אמיתיות. הבעיה היא שהשאלה שנבדקה צרה."],["What is Lior's advice?","Test with your own data and queries before you migrate",["Never migrate a database","Always use default settings"],"המשפט האחרון בטקסט."]]}

/* crypto */
const te=new TextEncoder(),tdc=new TextDecoder();
const b64=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function kdf(pass,salt,it){const base=await crypto.subtle.importKey("raw",te.encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:it||KIT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

async function gz(u){if(!window.CompressionStream)return null;try{return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer())}catch(e){return null}}
async function gunz(u){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer())}
async function encObj(obj,key,salt,it){let d=te.encode(JSON.stringify(obj)),z=0;const c=await gz(d);if(c){d=c;z=1}const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,d));return{app:"english-master",fmt:"em-enc-1",kdf:"PBKDF2-SHA256",it:it||KIT,salt:b64(salt),iv:b64(iv),z,ct:b64(ct),t:now()}}
async function decObj(p,key){const pt=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(p.iv)},key,ub64(p.ct)));return JSON.parse(tdc.decode(p.z?await gunz(pt):pt))}
async function encStr(s,key){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,te.encode(s))))}}
async function decStr(o,key){return tdc.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(o.iv)},key,ub64(o.ct)))}
/* non-extractable keys kept in IndexedDB (this device only) */
function idbOp(mode,fn){return Promise.race([new Promise((res,rej)=>{const r=indexedDB.open("em-keys",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onerror=()=>rej(r.error);r.onsuccess=()=>{const db=r.result,t=db.transaction("k",mode),q=fn(t.objectStore("k"));t.oncomplete=()=>{res(q&&q.result);db.close()};t.onerror=()=>rej(t.error)}}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("idb timeout")),3000))])}

/* GitHub */
async function gh(tok,path,o){o=o||{};let r;try{r=await fetch(GHA+path,{method:o.m||"GET",headers:Object.assign({Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"},o.b?{"Content-Type":"application/json"}:{}),body:o.b?JSON.stringify(o.b):undefined,cache:"no-store"})}catch(e){const x=new Error("אין חיבור לאינטרנט, או ש־GitHub לא זמין כרגע");x.net=1;throw x}

["keys","⌨️ קיצורי מקלדת",`<ul><li><b>כרטיסיות:</b> ${kb("Space")} או ${kb("Enter")} הפיכה, ${kb("→")} ידעתי, ${kb("←")} לא ידעתי, ${kb("↓")} או ${kb("K")} כבר יודע, ${kb("R")} תזכיר לי מחר, ${kb("E")} הצג משפט, ${kb("S")} הקראה, ${kb("Z")} או ${kb("↑")} ביטול אחרונה.</li><li><b>אמריקאי, שאלות קריאה, השלמת משפט:</b> ${kb("1")}–${kb("4")} בחירה, ${kb("Enter")} או ${kb("→")} הבא.</li><li><b>הקלדה, הקשבה, הטיות, תרגום משפט, ערבוב אותיות:</b> ${kb("Enter")} בודק ומעביר הלאה.</li><li><b>מיון מהיר:</b> ${kb("→")} יודע, ${kb("←")} ללמוד, ${kb("↓")} דלג.</li><li><b>מבחן:</b> ${kb("1")}–${kb("4")} בחירה.</li><li><b>מעבר מסכים:</b> ${kb("G")} ואז ${kb("H")} בית, ${kb("W")} מילים, ${kb("R")} קריאה, ${kb("S")} הגדרות.</li><li>${kb("?")} רשימת הקיצורים · ${kb("Esc")} סוגר חלונית או חוזר מסיפור לספרייה.</li></ul>`],

er the questions. | קרא את הקטע בקפידה לפני שאתה עונה על השאלות.\nThe second passage was longer than the first one. | הקטע השני היה ארוך יותר מהראשון.\nThe robot can perform a simple task many times. | הרובוט יכול לבצע משימה פשוטה פעמים רבות.\nEach student received a different task. | כל תלמיד קיבל משימה אחרת.\nThe hospital uses robots to carry supplies. | בית החולים משתמש ברובוטים כדי לשאת אספקה.\nMy sister works in a big hospital. | אחותי עובדת בבית חולים גדול.\nThe nurse checked the patient every hour. | האחות בדקה את המטופל כל שעה.\nA good nurse needs a lot of patience. | אח טוב צריך הרבה סבלנות.\nThe patient was ready to go home. | המטופל היה מוכן ללכת הביתה.\nThe nurses spend a lot of time with each patient. | האחיות מקדישות הרבה זמן לכל מטופל.\nThe robot moved slowly in the hall. | הרובוט נע לאט במסדרון.\nThe hall was crowded in the morning. | המסדרון היה צפוף בבוקר.\nThe machine can perform the same task without a mistake. | המכונה יכולה לבצע את אותה משימה בלי טעות.\nShe performed well on the second test. | היא ביצעה היטב את המבחן השני.\nThe robot saw its own reflection in the window. | הרובוט ראה את ההשתקפות שלו בחלון.\nA reflection on the floor confused the sensor. | השתקפות על הרצפה בלבלה את החיישן.\nThe river near the city is very long. | הנהר ליד העיר ארוך מאוד.\nAfter the rain, the water in the river went up. | אחרי הגשם, המים בנהר עלו.\nThe flood damaged many houses. | השיטפון פגע בבתים רבים.\nStrong rain can flood the streets. | גשם כבד יכול להציף את הרחובות.\nThere was a clear improvement in her results. | היה שיפור ברור בתוצאות שלה.\nEvery small improvement is important. | כל שיפור קטן חשוב.\nA good learner asks questions. | לומד טוב שואל שאלות.\nThe application helps each learner at his own speed. | האפליקציה עוזרת לכל לומד בקצב שלו.\nFind a supporting detail in the second paragraph. | מצא פרט תומך בפסקה השנייה.\nEach supporting detail explains the main idea. | כל פרט תומך מסביר את הרעיון המרכזי.\nThe robot followed a planned route. | הרובוט הלך ל את מפלס המים באופן קבוע.\nThe hall was crowded with people. | המסדרון היה צפוף באנשים.\nThe bus is always crowded in the morning. | האוטובוס תמיד צפוף בבוקר.\nPersistence is more important than natural ability. | התמדה חשובה יותר מיכולת טבעית.\nHer persistence helped her to improve. | ההתמדה שלה עזרה לה להשתפר.\nThe hospital staff trusts the new system. | צוות בית החולים סומך על המערכת החדשה.\nThe staff worked all night. | הצוות עבד כל הלילה.\nThe robot brings supplies to the nurses. | הרובוט מביא אספקה לאחיות.\nThe supplies arrived late. | האספקה הגיעה באיחור.\nThe rainfall this year was very high. | כמות הגשם השנה הייתה גבוהה מאוד.\nThe system uses data about rainfall. | המערכת משתמשת בנתונים על כמות גשם.\nAfter each round of testing, the engineers improved the system. | אחרי כל סבב בדיקות, המהנדסים שיפרו את המערכת.\nThe second round of testing was more accurate. | סבב הבדיקות השני היה מדויק יותר.\n\n#סיפור The Robot in the Hospital Hall | קשה\nEvery night, a small robot travels through the halls of a large hospital. Its task is simple but important: it carries supplies, such as medical equipment, food and small objects, from the storage room to the nurses on each floor. Before the robot arrived, the nurses had to perform this task, and they often spent more than an hour each night walking instead of caring for patients.\n\nThe robot follows a planned route. Sensors on the robot detect objects in its path, such as a bed, a chair or a person, and the robot stops or changes direction automatically. It also monitors its own movement and reports to the staff when a delivery is complete. According to the engineers who designed it, the robot is reliable in more than 99 percent of its trips.\n\nHowever, the system is not perfect. In its first weeks, the robot stopped several times in front of a large window. Engineers examined the data and discovered the reason: the sensor detected the reflection of the robot in the window and treated it as an object in the path. In another situation, the robot could not move through a crowded hall during a busy morning, and because of the delay, a nurse had to bring the supplies by hand.\n\nThe engineers revised the software after each round of testing, and the number of errors decreased gradually. Still, the staff emphasizes one important point. The robot can replace repeated physical work, but it cannot replace human judgment. When a patient's condition changes suddenly, the decision about what to do remains with the nurses.\n#שאלה What is the main task of the robot? | to carry supplies from the storage room to the nurses | to care for patients | to replace the nurses | to clean the halls | המשימה מתוארת בפסקה הראשונה.\n#שאלה What advantage did the robot bring to the nurses? | They spend less time walking and more time with patients | They earn more money | They work fewer days | They no longer need equipment | לפני הרובוט האחיות בזבזו יותר משעה בהליכה.\n#שאלה How does the robot avoid objects in its path? | Its sensors detect objects, and it stops or changes direction automatically | A nurse moves it | It moves only when the hall is empty | It follows the nurses | החיישנים מזהים חפצים, והרובוט מגיב אוטומטית.\n#שאלה Why did the robot stop in front of the window? | The sensor treated the reflection of the robot as an object in the path | The window was broken | The hall was crowded | The battery was empty | ההשתקפות בזכוכית נראתה לחיישן כמו מכשול.\n#שאלה In paragraph 3, the word \"delay\" is closest in meaning to: | a situation in which something happens later than planned | a decision | a mistake in the data | an improvement | delay פירושו עיכוב.\n#שאלה What happened after each round of testing? | The engineers revised the software, and the errors decreased gradually | The robot was replaced | The nurses stopped using the robot | The engineers added more robots | הירידה בשגיאות הייתה הדרגתית.\n#שאלה Which sentence is NOT correct, according to the text? | The robot makes decisions when a patient's condition changes | The robot follows a planned route | The robot reports to the staff | The robot is reliable in most trips | ההחלטות במצב רפואי נשארות אצל האחיות.\n#שאלה What is the main idea of the last paragraph? | The robot can replace repeated physical work, but not human judgment | Robots will replace nurses soon | The robot never makes errors | Engineers do not trust the robot | זו הנקודה שהצוות מדגיש.\n\n#סיפור Can We Predict a Flood? | קשה\nEvery winter, the people who live in a small city near a river face the same question: will the river flood this year? In the past, the city relied on a simple method. When the water level reached a certain point on a wall near the river, a warning was sent to everyone. The problem was that the warning often arrived too late, when the water was already in the streets.\n\nA team of researchers decided to try a different approach. They collected data from many years: daily rainfall, temperature, the water level of the river, and information about previous floods. Then they built a system that uses this data to predict the water level several hours before it changes. The purpose was not only to detect a flood, but to prevent damage by giving people more time.\n\nThe researchers were disappointed with the first results. The predictions were often too high, and the city received several warnings for floods that never happened. The researchers examined the errors carefully and discovered that the system relied too much on rainfall and ignored an important condition: when the ground is already full of water, even a small amount of rain can cause a serious event. After they revised the model, the predictions became much more accurate.\n\nToday, the system is used together with the old method, not instead of it. The researchers emphasize that no prediction can guarantee perfect accuracy. However, a prediction that is clearer and earlier allows people to make better decisions, and in a flood, a few hours can make a huge difference.\n#שאלה What was the problem with the old method? | The warning often arrived too late | It was too expensive | It predicted too many floods | It used too much data | האזהרה הגיעה כשהמים כבר היו ברחובות.\n#שאלה Which data did the researchers NOT collect, according to the text? | the number of cars in the city | daily rainfall | temperature | the water level of the river | מספר המכוניות לא מוזכר.\n#שאלה What was the purpose of the new system? | to give people more time and prevent damage | to build a new wall near the river | to stop the rain | to measure the temperature only | המטרה לא רק לזהות שיטפון אלא למנוע נזק.\n#שאלה Why were the researchers disappointed with the first results? | The predictions were often too high | The system did not work at all | The city did not use it | There were no floods | התחזיות היו גבוהות מדי והיו אזהרות שווא.\n#שאלה What condition did the system ignore at first? | that when the ground is full of water, a small amount of rain can cause a flood | the temperature of the river | the time of day | the number of people in the city | התנאי שהתגלה בבחינת השגיאות.\n#שאלה In paragraph 3, \"revised\" is closest in meaning to: | changed and improved | deleted | ignored | repeated | revise פירושו לשנות ולעדכן.\n#שאלה How is the system used today? | together with the old method | instead of the old method | only at night | only by the researchers | כתוב במפורש: together with the old method, not instead of it.\n#שאלה Which statement would the researchers agree with? | A clearer and earlier prediction helps people decide, even if it is not perfect | A prediction can guarantee perfect accuracy | The old method is useless | Rainfall is the only important factor | הם מדגישים שאין דיוק מושלם, אבל התחזית עוזרת.\n\n#סיפור Why Practice Alone Is Not Enough | קשה\nMany students believe that the key to improvement is simple: spend more hours practicing. A student who wants to read English faster reads more passages; a student who wants to improve in math solves more exercises. Research suggests, however, that the amount of practice is only part of the story. The type of practice matters at least as much.\n\nResearchers who study learning distinguish between two kinds of practice. The first is routine practice: repeating the same activity again and again, often without attention. The second is focused practice: an effort to improve a specific weakness, with clear goals and quick feedback. In one study, two groups of learners practiced for the same number of hours. The first group simply repeated exercises. The second group concentrated on the mistakes that each learner made, received feedback after every attempt, and changed their strategy when it was not effective. After a month, the second group showed significantly more progress, although both groups spent the same time.\n\nFocused practice is not easy. It requires discipline, because it is more comfortable to repeat what we already know than to focus on what is difficult. It can also make learners disappointed, because they see their weaknesses again and again. For this reason, persistence is essential. Students who persist through the difficult first period often discover that their motivation increases as they see real results.\n\nThe lesson for learners is clear. Instead of asking \"How much did I practice?\", it is more useful to ask \"What exactly did I improve today?\"\n#שאלה What do many students believe, according to paragraph 1? | that spending more hours practicing is the key to improvement | that practice is useless | that only natural ability matters | that feedback is more important than practice | זו האמונה שהטקסט מאתגר.\n#שאלה What is routine practice? | repeating the same activity again and again, often without attention | a focused effort to improve a weakness | practice with a teacher | practice that requires feedback | זו ההגדרה בפסקה השנייה.\n#שאלה Which feature is part of focused practice? | quick feedback | practicing without goals | repeating what you already know | avoiding difficult tasks | תרגול מכוון כולל מטרות ברורות ומשוב מיידי.\n#שאלה Why is the study in paragraph 2 important? | Both groups spent the same time, so the difference came from the type of practice | The second group practiced more hours | The first group had better teachers | Only one group practiced | מכיוון שהזמן היה זהה, ההבדל נובע מסוג התרגול.\n#שאלה In paragraph 2, \"distinguish between\" means: | recognize the difference between | combine | repeat | ignore | distinguish between = להבחין בין.\n#שאלה Why can focused practice make learners disappointed? | They see their weaknesses again and again | It takes no effort | It is always slow | It never works | כי מתמקדים כל הזמן בחולשות.\n#שאלה According to the text, what often happens to students who persist? | Their motivation increases as they see real results | They lose motivation | They stop practicing | They need less discipline | ההתמדה מובילה לתוצאות, והתוצאות מגבירות מוטיבציה.\n#שאלה What question does the writer recommend? | \"What exactly did I improve today?\" | \"How much did I practice?\" | \"Who practiced more than me?\" | \"Which exercise is the easiest?\" | זו המסקנה בפסקה האחרונה.\n\n#סיפור The Student Who Read Too Fast | קשה\nNoa was preparing for an important English test. Every evening, she read three or four long passages and answered the questions as quickly as possible. She was proud of her speed, but her results remained almost unchanged. In each test, she answered about half of the questions correctly.\n\nHer teacher asked her to try a different approach. \"For one week,\" he said, \"read only one passage each evening, but read it carefully. First, find the main idea of the passage. Then find each supporting detail and ask which part of the main idea it explains. Finally, when you answer a question, find the evidence in the text before you choose an answer.\"\n\nInitially, Noa was frustrated. The new method was slow, and she felt that she was not making progress. However, after a few days she noticed something interesting. Many of her previous mistakes were not caused by difficult words. They were caused by details that she had read too quickly, or by answers that seemed correct but were irrelevant to the specific question. When she searched for evidence, she could distinguish between an answer that was really in the text and an answer that only sounded familiar.\n\nAt the end of the month, Noa's accuracy improved from 50 to 80 percent. She still reads quickly when the information is simple. But now she adapts her speed to the purpose of the reading. \"Reading fast is useful,\" she says, \"but only if you understand what you read.\"\n#שאלה Why was Noa disappointed with her results? | They remained almost unchanged although she practiced every evening | She did not practice at all | She read too slowly | Her teacher gave her difficult passages | התוצאות שלה כמעט לא השתנו.\n#שאלה What did the teacher ask Noa to do first when she reads a passage? | find the main idea | answer the questions quickly | read four passages | look for difficult words | השלב הראשון הוא למצוא את הרעיון המרכזי.\n#שאלה What is the role of a supporting detail, according to the teacher? | to explain a part of the main idea | to replace the main idea | to make the passage longer | to make the reader confused | הוא מסביר איזה חלק של הרעיון המרכזי.\n#שאלה Why was Noa frustrated initially? | The new method was slow, and she felt no progress | Her teacher was angry | The passages were too short | She did not understand the instructions | בהתחלה השיטה הייתה איטית.\n#שאלה What did Noa discover about her previous mistakes? | Many were caused by details read too quickly or by irrelevant answers | All of them were caused by difficult words | They were caused by her teacher | She had no mistakes | הטעויות לא נבעו ממילים קשות.\n#שאלה In paragraph 3, \"irrelevant\" means: | not connected to the question | very difficult | correct | interesting | irrelevant = לא רלוונטי.\n#שאלה What does Noa do today? | She adapts her speed to the purpose of the reading | She always reads slowly | She always reads fast | She reads only one passage a month | היא מתאימה את הקצב למטרה.\n#שאלה What is the main idea of the text? | Careful reading and searching for evidence can improve accuracy more than speed | Reading fast is always better | Tests are too difficult | Teachers do not help students | הרעיון: קריאה זהירה וחיפוש ראיות משפרים דיוק.\n\n#סיפור Feedback That Helps and Feedback That Hurts | קשה\nAlmost every teacher and manager gives feedback, but not all feedback contributes to improvement. Researchers who examined thousands of cases found a surprising result: in about one third of them, feedback actually reduced performance. How can something that is designed to help make people worse?\n\nThe answer depends on what the feedback focuses on. Feedback that focuses on the person, such as \"You are not good at this,\" tends to reduce motivation. The learner becomes disappointed and often stops making an effort. Feedback that focuses on the task, such as \"In this paragraph, the evidence does not support your main idea,\" is much more effective. It gives the learner specific information that he can use in the next attempt.\n\nTiming also matters. Feedback is most useful when it arrives soon after the activity, while the learner still remembers what he did. Feedback that arrives weeks later is often irrelevant, because the learner has already moved on to a different task. In addition, feedback should be clear. A comment such as \"Improve your writing\" does not explain what to change, whereas \"Use shorter sentences in the first section\" allows the learner to act immediately.\n\nFinally, effective feedback compares the learner's performance with a goal, not with other people. When students are compared with the majority of the class, those with the lowest results often feel that progress is impossible. When they are compared with their own previous results, they can see gradual improvement, and this helps them maintain their persistence.\n#שאלה What surprising result did the researchers find? | In about one third of the cases, feedback reduced performance | Feedback always helps | Feedback never helps | Feedback is irrelevant | הממצא המפתיע הוא שבשליש מהמקרים משוב פגע בביצועים.\n#שאלה Which feedback tends to reduce motivation? | feedback that focuses on the person | feedback that focuses on the task | feedback that is clear | feedback that arrives soon | משוב על האדם עצמו פוגע במוטיבציה.\n#שאלה Why is feedback that focuses on the task more effective? | It gives specific information that the learner can use in the next attempt | It is shorter | It is always positive | It compares learners | זה מה שכתוב בפסקה השנייה.\n#שאלה Why is feedback that arrives weeks later often irrelevant? | The learner has already moved on to a different task | It is too long | It is too positive | The teacher forgets it | הלומד כבר עבר למשימה אחרת.\n#שאלה Which comment is the most useful, according to paragraph 3? | \"Use shorter sentences in the first section.\" | \"Improve your writing.\" | \"You are not good at this.\" | \"This is bad.\" | זו הדוגמה להערה ברורה שאפשר לפעול לפיה.\n#שאלה In paragraph 1, \"contributes to\" is closest in meaning to: | helps to create | prevents | measures | replaces | contribute to = לתרום ל־.\n#שאלה Why should learners be compared with their own previous results? | so that they can see gradual improvement and maintain persistence | so that they feel better than other students | because the majority of the class is weak | because goals are not important | ההשוואה לעצמם מראה שיפור הדרגתי.\n#שאלה What is the main idea of the text? | Feedback helps only when it focuses on the task, arrives in time, is clear, and compares with a goal | Feedback always reduces performance | Teachers should not give feedback | Students should be compared with the majority of the class | הטקסט מפרט את התנאים למשוב יעיל.\n\n#סיפור A Machine Can Measure, but Can It Decide? | קשה\nIn many hospitals today, patients use small sensors that monitor their heart, temperature and movement throughout the day. The data is sent automatically to a main system, which can detect warning signs earlier than a nurse who checks the patient only every few hours. In one study, a system of this kind predicted serious changes in the condition of patients up to six hours before the staff noticed them.\n\nThis is a clear advantage. However, the same research revealed a problem. The system produced many warnings, and the majority of them were not serious. A sensor might move when a patient turned in bed, or a temperature might go up for a few minutes and then return to normal. After hundreds of repeated false warnings, some nurses began to ignore the system, and a few real warnings were missed.\n\nThe engineers tried two strategies to solve the problem. First, they improved the accuracy of the sensors, so that ordinary movements would not cause an alert. Second, they changed the system so that it would not send a warning unless two different sensors showed a problem at the same time. After these changes, the number of warnings dropped significantly, and the staff began to trust the system again.\n\nThe experience taught the hospital an important lesson. A machine can measure accurately and work without rest, but the final decision still requires human judgment. Nurses know things that sensors cannot measure: how a patient looks, what he says, and how his situation has changed since yesterday. The most reliable approach combines the two.\n#שאלה What is the main advantage of the sensors? | They can detect warning signs earlier than a nurse | They replace nurses | They reduce the price of the hospital | They make patients move less | המערכת מזהה סימני אזהרה מוקדם יותר.\n#שאלה What problem did the research reveal? | The system produced many warnings that were not serious | The sensors did not work | The patients refused to use them | The data was lost | רוב האזהרות לא היו רציניות.\n#שאלה Why did some nurses begin to ignore the system? | They received hundreds of repeated false warnings | They did not trust machines from the beginning | They were not trained | The system was too slow | ריבוי אזהרות שווא גרם להתעלמות.\n#שאלה What was the result of ignoring the system? | A few real warnings were missed | The sensors broke | Patients went home | The engineers left | כמה אזהרות אמיתיות לא קיבלו מענה.\n#שאלה What does \"unless\" mean in \"it would not send a warning unless two different sensors showed a problem\"? | only if not / if not | because | although | after | unless = אלא אם.\n#שאלה Which strategy did the engineers use? | improving the accuracy of the sensors | removing the sensors | sending more warnings | asking patients to stop moving | שתי האסטרטגיות מפורטות בפסקה השלישית.\n#שאלה What do nurses know that sensors cannot measure, according to the text? | how a patient looks, what he says, and how his situation has changed | the temperature of the patient | the movement of the patient | the speed of the heart | אלה דברים ששיקול דעת אנושי תופס.\n#שאלה What is the writer's conclusion? | The most reliable approach combines measuring by machines and human judgment | Machines should make all decisions | Nurses should not use sensors | Sensors are useless | המסקנה: לשלב את שניהם.\n\n#סיפור Small Habits, Big Results | קשה\nMany people begin a new year with big goals: to read more, to practice English every day, or to exercise regularly. After a month, most of them have stopped. The problem is usually not that they have no motivation. In the first days, motivation is high. The problem is that motivation is not consistent. It changes from day to day, and a plan that depends only on motivation is likely to fail.\n\nResearchers who study habits suggest a different strategy. Instead of relying on motivation, people should build a routine that requires very little effort. A student who wants to improve his English, for example, does not need to study for two hours every day. He can begin with ten minutes, at the same time and in the same place, for instance immediately after breakfast. Because the task is small, it is easy to repeat even on a difficult day. Over time, the routine becomes automatic, and the student can gradually increase the amount of practice.\n\nA second principle is to make the action that you want easy and the action that you do not want difficult. A learner who keeps his phone in another room is less likely to lose attention, and a learner who prepares his book the night before is more likely to start. These changes seem small, but they reduce the number of decisions that a person must make each day.\n\nFinally, discipline does not mean being perfect. Everyone misses a day sometimes. What matters is to return to the routine quickly. Research shows that missing one day has almost no effect on the long-term result, but missing several days in a row often breaks the habit. In other words, persistence is more important than perfect performance.\n#שאלה According to paragraph 1, why do most people stop pursuing their goals? | Motivation is not consistent | They have no motivation at all | Their goals are too easy | They do not have time | הבעיה היא שהמוטיבציה לא עקבית.\n#שאלה What strategy do researchers suggest instead of relying on motivation? | building a routine that requires very little effort | studying for two hours every day | waiting for high motivation | changing goals every week | שגרה קטנה שקל לחזור עליה.\n#שאלה Why does the writer recommend starting with ten minutes? | A small task is easy to repeat even on a difficult day | Ten minutes is enough to learn English | Longer practice is harmful | Breakfast is short | משימה קטנה קל לבצע גם ביום קשה.\n#שאלה In paragraph 2, \"automatic\" means: | done without much thinking | very fast | done by a machine | difficult | שגרה שהופכת לאוטומטית נעשית כמעט בלי מחשבה.\n#שאלה Which example shows making an action that you do not want difficult? | keeping the phone in another room | preparing the book the night before | studying after breakfast | practicing for ten minutes | הטלפון בחדר אחר מקשה על הסחת הדעת.\n#שאלה Why are these small changes useful, according to paragraph 3? | They reduce the number of decisions that a person must make | They increase motivation | They make goals bigger | They replace practice | פחות החלטות ביום = פחות מאמץ.\n#שאלה What does research show about missing days? | Missing one day has almost no effect, but missing several days in a row often breaks the habit | Missing one day breaks the habit | Missing days is never a problem | People should never miss a day | זה הנתון בפסקה האחרונה.\n#שאלה What is the main idea of the text? | Small, consistent routines and quick returns after mistakes build lasting habits | Motivation is the most important factor | Big goals are always better | Discipline means never making mistakes | הרעיון המרכזי: שגרה קטנה ועקבית והתמדה.\n\n#סיפור Access Denied | קשה\nOn the first day of the exam period, hundreds of students tried to open the online test system of their school, and many of them saw the same error message: \"Access denied. You do not have permission to view this page.\" The students were anxious, and the help desk received more than 300 calls in one hour.\n\nThe technical team examined the system carefully. The servers were available, and the network was working. The problem was in the permissions. A few days before the exams, an engineer had changed the configuration of the system in order to prevent students from opening the tests before the official time. The purpose was reasonable, but the change contained a small error. Instead of allowing access at nine in the morning, the system required a permission that only teachers had.\n\nThe team faced a difficult decision. They could fix the configuration immediately, although the change had not been tested, or they could delay the exam by one day. They chose a third approach. They restored the previous configuration, which was known to be reliable, and asked teachers to open each test manually. As a result, the exams began with a delay of only 40 minutes.\n\nIn the review after the incident, the team identified the main cause: the change had been tested by a teacher's account, not by a student's account. Therefore, the test showed that everything worked. The team decided that from now on, every change in permissions must be examined with the account of a real student before an exam period. \"The system did exactly what we told it to do,\" the engineer said. \"The problem is that we told it the wrong thing.\"\n#שאלה What error message did the students see? | that they did not have permission to view the page | that the server was down | that their password was wrong | that the test was over | הודעת השגיאה עסקה בהרשאה.\n#שאלה What did the technical team find when they examined the system? | The servers and the network worked; the problem was in the permissions | The servers were down | Hackers attacked the system | The students made a mistake | כתוב במפורש שהשרתים זמינים והרשת עובדת.\n#שאלה Why had the engineer changed the configuration? | to prevent students from opening the tests before the official time | to make the system faster | to give students more time | to replace the servers | מטרת השינוי הייתה סבירה.\n#שאלה What was the error in the change? | The system required a permission that only teachers had | The system allowed access too early | The system deleted the tests | The system had no password | במקום לאפשר גישה בתשע, המערכת דרשה הרשאת מורה.\n#שאלה Which approach did the team choose? | restoring the previous reliable configuration and asking teachers to open each test | fixing the configuration immediately | delaying the exam by one day | canceling the exams | הם בחרו בדרך שלישית.\n#שאלה In paragraph 3, \"although\" introduces: | a contrast: the fix was possible, but it had not been tested | a reason for the decision | a result of the error | an example | although = למרות ש־; מציג ניגוד.\n#שאלה Why did the original test not detect the problem? | It was done with a teacher's account, not a student's account | It was done too late | Nobody tested the change | The test was perfect | למורה הייתה ההרשאה, ולכן נראה שהכול עובד.\n#שאלה What does the engineer mean by \"we told it the wrong thing\"? | The system worked correctly; the instructions that people gave it were wrong | The system was broken | The students gave wrong answers | The teachers made the error | המערכת ביצעה בדיוק את מה שהגדירו לה, וההגדרה הייתה שגויה.\n\n#סיפור Will Robots Replace Us? | קשה\nEvery few years, new articles predict that robots will soon replace most workers. Machines already perform many tasks in industry, in stores and even in hospitals. They do not get tired, they do not need breaks, and they can repeat the same movement thousands of times with perfect accuracy. For an employer, these advantages are obvious.\n\nHowever, the actual situation is more complex than the articles suggest. Researchers who examined the effect of automation over several decades found that machines usually replace specific tasks, not whole jobs. A robot can carry supplies through a hospital, but it cannot calm an anxious patient. A system can detect an error in a report, but it cannot decide whether the error is relevant to an important decision. In most jobs, some tasks are routine and easy to automate, while others require human judgment, talking with people and the ability to adapt to unexpected situations.\n\nAs a result, the jobs that change the most are not necessarily the jobs that disappear. In many cases, workers spend less time on repeated physical work and more time on tasks that machines cannot do. Nurses who no longer carry equipment, for example, can spend more time with patients. Still, this change is not automatic. Workers need training, and organizations need a clear strategy.\n\nThe researchers therefore suggest that the important question is not \"Will robots replace us?\" but \"Which parts of our work can machines do better, and how can we use the time that they give us?\"\n#שאלה What advantages of machines are mentioned in paragraph 1? | They do not get tired, do not need breaks, and can repeat movements accurately | They understand patients | They make all decisions | They cost nothing | אלה היתרונות שמפורטים.\n#שאלה What did researchers find about the effect of automation? | Machines usually replace specific tasks, not whole jobs | Machines replace whole jobs | Machines have no effect | Machines create more errors | זה הממצא המרכזי.\n#שאלה Which task does the text say a robot cannot do? | calm an anxious patient | carry supplies | detect an error in a report | repeat a movement | עידוד מטופל מפוחד דורש אדם.\n#שאלה In paragraph 2, \"actual\" is closest in meaning to: | real | expected | old | simple | actual = בפועל, ממשי.\n#שאלה Which tasks are easy to automate, according to the text? | routine tasks | tasks that require human judgment | tasks that require talking with people | tasks in unexpected situations | משימות שגרתיות קל להפוך לאוטומטיות.\n#שאלה What does \"the jobs that change the most are not necessarily the jobs that disappear\" mean? | A job can change a lot without disappearing | Every job that changes disappears | No job changes | Only new jobs change | שינוי גדול בעבודה לא אומר שהיא נעלמת.\n#שאלה What do workers and organizations need, according to paragraph 3? | training and a clear strategy | more robots | fewer patients | longer breaks | השינוי לא קורה אוטומטית.\n#שאלה What question do the researchers suggest? | Which parts of our work can machines do better, and how can we use the time they give us? | Will robots replace us? | When will robots replace nurses? | How much do robots cost? | זו השאלה שמחליפה את שאלת הכותרת.\n\n#סיפור When the Prediction Was Wrong | קשה\nA company with many small bread stores used a computer system to predict how much bread each store would need every day. The system was based on data from previous years: the day of the week, the weather, and the amount of bread sold. For three years, the predictions were very accurate, and the company could reduce the amount of bread that nobody bought at the end of the day.\n\nThen, one winter, the system failed badly in a few stores. It predicted a normal week, but the actual amount that people bought was almost twice as high. By ten in the morning, these stores had no bread left, and customers went to competitors. The managers were disappointed and asked the engineers to explain the error.\n\nThe engineers examined the data carefully. The problem was not in the method itself, which was still effective. The problem was that an important condition had changed. That winter, a large new office building had opened near those stores, and thousands of new workers passed by every morning on their way to work. This information was not in the data, because the system only used information about the bread that people bought and the weather. In other words, the data was accurate, but it was not complete.\n\nThe engineers revised the system. They added information about new buildings and events in each part of the city, and they also changed the process: every week, a worker in each store could clarify the prediction and correct it if he saw a reason. After this change, the predictions became clearer and more reliable. The lesson was simple but important: a model can only predict what its data allows it to see.\n#שאלה What was the system used to predict? | how much bread each store would need every day | the weather | the number of workers | the price of bread | זו מטרת המערכת.\n#שאלה What happened in the winter when the system failed? | People bought almost twice as much as the prediction | Nobody bought bread | The stores closed | The prices increased | הכמות בפועל הייתה כמעט כפולה.\n#שאלה What was the result of the wrong prediction? | The stores had no bread left, and customers went to competitors | The company made more money | The engineers lost their jobs | The weather changed | חוסר מלאי שלח לקוחות למתחרים.\n#שאלה Why did the engineers say that the method itself was not the problem? | The method was still effective; an important condition had changed | The method was new | The method was never tested | The managers used it wrongly | הבעיה הייתה בתנאי שהשתנה.\n#שאלה What information was missing from the data? | information about a new office building and its workers | the weather | the day of the week | the bread that people bought in the past | המערכת השתמשה רק בנתוני מכירות ומזג אוויר.\n#שאלה \"The data was accurate, but it was not complete.\" This sentence means that: | the data was correct, but some relevant information was missing | the data had errors | the data was too large | the data was irrelevant | הנתונים היו נכונים אבל חסרים.\n#שאלה Which change did the engineers make in the process? | A worker in each store could clarify and correct the prediction | They stopped making predictions | They used only weather data | They closed some stores | שילוב של שיקול דעת אנושי.\n#שאלה What is the lesson of the story? | A model can only predict what its data allows it to see | Computers always predict correctly | Weather data is useless | Engineers should not trust data | זה המשפט האחרון.\n\n#סיפור Can You Concentrate in a Crowded World? | קשה\nImagine a student who sits down to read an important passage. After three minutes, a notification appears on his phone. He looks at it for only a few seconds, but when he returns to the text, he needs time to find the place where he stopped and to remember the main idea. Research suggests that after such an interruption, it can take several minutes to concentrate completely again. If notifications arrive every few minutes, the student may never concentrate well at all.\n\nAttention is a limited resource. When we try to focus on two activities at the same time, such as reading and checking messages, we do not really do both. Instead, the brain switches quickly between them, and every switch has a small cost. The result is slower work and more errors. In one experiment, students who kept their phones on the table, even with the screen turned off, performed worse on a test than students who left their phones in another room. Just seeing the phone on the table seemed to take part of their attention.\n\nThe good news is that the ability to concentrate can be improved with practice. Effective strategies include working in short, focused periods, for example 25 minutes, followed by a short break; turning off notifications during study time; and preparing the task before you begin so that no time is lost on decisions. Some learners also find it useful to write down thoughts that come during work on a paper and return to them later.\n\nNo method is perfect. But in a world that is crowded with information, the ability to maintain attention may be one of the most valuable skills that a student can develop.\n#שאלה What happens to the student after he looks at the notification? | He needs time to find his place and remember the main idea | He reads faster | He forgets the whole passage | Nothing changes | ההפרעה גורמת לאובדן ריכוז.\n#שאלה According to the text, what really happens when we try to focus on two activities at once? | The brain switches quickly between them, and every switch has a cost | We do both perfectly | We do only one and ignore the other completely | We concentrate better | המוח מדלג ביניהן, ולכל מעבר יש מחיר.\n#שאלה What did the experiment with phones show? | Students with phones on the table performed worse, even with the screen off | Phones help students concentrate | Only phones with notifications cause problems | Students in another room performed worse | עצם נוכחות הטלפון פגעה בביצועים.\n#שאלה In paragraph 2, \"limited resource\" means that attention: | exists only in a certain amount | has no limit | is not important | can be bought | משאב מוגבל קיים בכמות מסוימת בלבד.\n#שאלה Which strategy is NOT recommended in paragraph 3? | keeping the phone on the table with the screen off | working in short, focused periods | turning off notifications | preparing the task before you begin | זו בדיוק ההתנהגות מהניסוי שפגעה בביצועים.\n#שאלה Why is it useful to prepare the task before you begin? | so that no time is lost on decisions | so that the task is shorter | so that the teacher is happy | so that the phone is off | כתוב: so that no time is lost on decisions.\n#שאלה What does the writer think about these methods? | They are not perfect, but they can help | They solve every problem | They are useless | They are only for teachers | \"No method is perfect\", אבל הם עוזרים.\n#שאלה What is the main idea of the text? | Attention is limited, but the ability to concentrate can be improved with practice | Phones should be banned | Students cannot concentrate | Notifications improve learning | זה הרעיון שמסכם את הטקסט.\n\n#סיפור The Last Round of Testing | קשה\nA team of engineers developed an automatic system that helps people decide when to water large gardens. Sensors in the ground measure the amount of water, and the system combines this data with the weather prediction. If rain is expected, the system waits; if the ground has almost no water and no rain is expected, it opens the water.\n\nBefore they released the system, the engineers planned three steps. In the first round of testing, they evaluated the system in a lab. The results were nearly perfect: the sensors measured the water accurately, and the system made the correct decision in every case. However, the engineers knew that a lab is very different from a real garden.\n\nIn the second round of testing, they installed the system in five gardens. This time, several problems appeared. In one garden, the sensors gave strange results because animals moved them. In another, the system opened the water during strong wind, and most of the water was wasted. The engineers reviewed every error and revised the system: they protected the sensors and added information about wind.\n\nThe third round of testing was the most important one. The engineers compared the new system with the traditional method that people used. On average, the system used 30 percent less water, and the gardens looked just as good. Therefore, the engineers concluded that the system was not only accurate but also efficient.\n\nThe experience taught the team that each round of testing has a different purpose. The lab shows whether the idea can work. The real garden shows whether it works in practice. And comparing with the old method shows whether it is really better than what people already do.\n#שאלה What does the system decide? | when to water large gardens | how much rain will fall | which sensors to buy | where to build gardens | זו מטרת המערכת.\n#שאלה What does the system do if rain is expected? | It waits | It opens the water | It turns off the sensors | It sends a warning | כתוב: If rain is expected, the system waits.\n#שאלה Why did the engineers not rely only on the results from the lab? | A lab is very different from a real garden | The results were bad | The sensors were broken | The lab was too small | התוצאות היו כמעט מושלמות, אבל המעבדה שונה מהשטח.\n#שאלה Which problem appeared in the second round of testing? | Animals moved the sensors | The system used too much electricity | The lab was closed | The engineers left | זו אחת הבעיות שהופיעו בשטח.\n#שאלה In paragraph 3, \"reviewed\" is closest in meaning to: | examined again carefully | ignored | deleted | replaced | review = לבדוק / לעבור שוב.\n#שאלה What did the third round of testing show? | The system used 30 percent less water, and the gardens looked just as good | The system was not accurate | The system used more water | People refused to use it | ההשוואה הראתה חיסכון במים בלי פגיעה.\n#שאלה Why did the engineers conclude that the system was efficient? | It used less water and achieved the same result | It was cheap | It was fast | It had many sensors | יעילות = אותה תוצאה עם פחות משאבים.\n#שאלה According to the last paragraph, what is the purpose of comparing with the old method? | to show whether the system is really better than what people already do | to show whether the idea can work | to find errors in the sensors | to measure rainfall | לכל סבב בדיקות יש מטרה אחרת.\n\n#סיפור A Challenge Worth Trying | בינוני\nAt the start of the year, Omer's teacher gave the class a challenge: to read one English article every week and write a short summary of its main idea. For Omer, the challenge seemed impossible. His first attempt took him three hours, and his summary was full of errors.\n\nHe was disappointed, but he decided to persist. Each week, he made a small effort to improve one specific thing: first the main idea, then the supporting details, and finally his own sentences. After two months, an article took him less than an hour. The challenge had not become easier; Omer had become better.\n#שאלה What was the challenge? | to read one English article every week and write a summary of its main idea | to read a book every day | to write a long story | to learn ten words a week | זה האתגר שהמורה נתנה.\n#שאלה How did Omer feel after his first attempt? | disappointed | proud | bored | relieved | הניסיון הראשון היה ארוך ומלא שגיאות.\n#שאלה In paragraph 2, \"persist\" means: | to continue trying although it is difficult | to stop | to ask for help | to change the challenge | persist = להתמיד.\n#שאלה What does the last sentence tell us? | Omer improved, not the challenge | The challenge became easier | Omer stopped reading | The teacher changed the challenge | האתגר נשאר אותו אתגר, עומר השתפר.\n\n#סיפור Guided Practice | בינוני\nWhen learners start a new skill, it is often useful to practice with guidance. In guided practice, a teacher shows the learner each step, watches the first attempts, and g
